    if(n===1) return {t:'Маргааш', tone:'warn'};

    return {t:md(fromIso(s))+' хүртэл', tone:''};

}

// ---------- smooth re-rendering ----------
// Instead of replacing the page on every change, the new HTML is laid over the old one: elements that stay keep
// their place, focus, scroll and running animations, and CSS transitions can animate the change (a pressed tab sliding, a bar growing).
function morph(el, html){ var t=document.createElement('template'); t.innerHTML=html; morphKids(el, t.content); }
function sameNode(a,b){
  if(a.nodeType!==b.nodeType) return false;
  if(a.nodeType!==1) return true;
  return a.nodeName===b.nodeName && (a.id||'')===(b.id||'') && (a.getAttribute('data-key')||'')===(b.getAttribute('data-key')||'');
}
function morphKids(a,b){
  var bn=b.childNodes;
  for(var i=0;i<bn.length;i++){
    var nb=bn[i], na=a.childNodes[i];
    if(!na) a.appendChild(document.importNode(nb,true));
    else if(sameNode(na,nb)) morphNode(na,nb);
    else a.replaceChild(document.importNode(nb,true), na);
  }
  while(a.childNodes.length>bn.length) a.removeChild(a.lastChild);
}
function morphNode(a,b){
  if(a.nodeType!==1){ if(a.nodeValue!==b.nodeValue) a.nodeValue=b.nodeValue; return; }
  var i, at;
  for(i=a.attributes.length-1;i>=0;i--){ at=a.attributes[i].name; if(!b.hasAttribute(at)) a.removeAttribute(at); }
  for(i=0;i<b.attributes.length;i++){ at=b.attributes[i]; if(a.getAttribute(at.name)!==at.value) a.setAttribute(at.name, at.value); }
  var tag=a.nodeName, focused=a===document.activeElement;
  if(tag==='INPUT'){
    if(a.type==='checkbox'||a.type==='radio') a.checked=b.hasAttribute('checked');
    else if(!focused && a.type!=='file' && a.value!==(b.getAttribute('value')||'')) a.value=b.getAttribute('value')||'';
    return;
  }
  if(tag==='TEXTAREA'){ if(!focused && a.value!==b.textContent) a.value=b.textContent; return; }
  if(tag==='IFRAME') return;
  morphKids(a,b);
  if(tag==='SELECT' && !focused){ var o=b.querySelector('option[selected]'); a.value=o?o.value:(a.options[0]?a.options[0].value:''); }
}

}

function parseLink(u){
  u=String(u||'').trim(); if(!/^https:\/\//i.test(u)) return null;
  var m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  if(m) return {kind:'drive', id:m[1], url:u, preview:'https://drive.google.com/file/d/'+m[1]+'/preview'};
  m=u.match(/docs\.google\.com\/(document|presentation|spreadsheets)\/d\/([\w-]{10,})/);
  if(m) return {kind:'drive', id:m[2], url:u, preview:'https://docs.google.com/'+m[1]+'/d/'+m[2]+'/preview'};
  if(/drive\.google\.com\/drive\/(?:u\/\d\/)?folders\//.test(u)) return {kind:'folder', url:u};
  return {kind:'link', url:u};
}

var CFG = window.BO_CONFIG || {};
function deepMerge(a,b){ Object.keys(b).forEach(function(k){ var v=b[k]; if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])) deepMerge(a[k],v); else a[k]=v; }); return a; }
function supaDB(sb, table){
  table=table||'docs';
  var cache={}, listeners={};
  function snap(col){ var m=cache[col]||{}; return {docs:Object.keys(m).map(function(id){ var v=m[id]; return {id:id, exists:true, data:function(){ return v; }, metadata:{fromCache:false}}; }), metadata:{fromCache:false, hasPendingWrites:false}}; }
  function emit(col){ (listeners[col]||[]).forEach(function(l){ l(snap(col)); }); }
  function chk(r){ if(r && r.error){ var e=r.error; throw {code:(e.code==='42501'||/permission|policy/i.test(e.message||''))?'invalid_argument':'unavailable', message:e.message}; } return r; }
  sb.channel(table+'-live').on('postgres_changes', {event:'*', schema:'public', table:table}, function(p){
    var r=(p.new&&p.new.col)?p.new:p.old; if(!r||!r.col) return;
    cache[r.col]=cache[r.col]||{};
    if(p.eventType==='DELETE') delete cache[r.col][r.id]; else cache[r.col][r.id]=p.new.data;
    emit(r.col);
  }).subscribe();
  function load(col){ return sb.from(table).select('id,data').eq('col',col).then(function(r){ chk(r); cache[col]={}; (r.data||[]).forEach(function(x){ cache[col][x.id]=x.data; }); emit(col); }); }
  function split(path){ var i=path.indexOf('/'); return [path.slice(0,i), path.slice(i+1)]; }
  function row(col,id,data){ return {col:col, id:id, data:data, updated_at:new Date().toISOString()}; }
  return {
    collection:function(col){ return { onSnapshot:function(cb, err){ (listeners[col]=listeners[col]||[]).push(cb); load(col).catch(function(e){ if(err) err(e); }); return function(){}; } }; },
    doc:function(path){
      var p=split(path), col=p[0], id=p[1];
      return {
        get:function(){ return sb.from(table).select('data').eq('col',col).eq('id',id).maybeSingle().then(function(r){ chk(r); var v=r.data&&r.data.data; return {exists:!!v, data:function(){ return v; }}; }); },
        set:function(data){ (cache[col]=cache[col]||{})[id]=data; return sb.from(table).upsert(row(col,id,data)).then(chk); },
        update:function(data){ var cur=clone((cache[col]||{})[id]||{}); deepMerge(cur,data); (cache[col]=cache[col]||{})[id]=cur; return sb.from(table).upsert(row(col,id,cur)).then(chk); },
        delete:function(){ if(cache[col]) delete cache[col][id]; return sb.from(table).delete().eq('col',col).eq('id',id).then(chk); },
        acquire:function(){ return sb.from(table).insert(row('locks', col+':'+id, {at:new Date().toISOString()})).then(function(r){ return {acquired:!r.error}; }); }
      };
    }
  };
}

  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); });
}

// ---------- calculations ----------
function monthOf(dateStr){ return String(dateStr||'').slice(0,7); }
function txIn(m){ return FIN.data.fin_tx.filter(function(t){ return monthOf(t.date)===m; }); }
function txYear(y){ return FIN.data.fin_tx.filter(function(t){ return String(t.date).slice(0,4)===y; }); }
function sumBy(list, type, plOnly){ return list.filter(function(t){ return t.type===type && (!plOnly || !fcat(t.cat).nopl); }).reduce(function(s,t){ return s+(+t.amount||0); },0); }
function plan(){ var y=FIN.month.slice(0,4); return FIN.data.fin_plan.filter(function(p){ return p.id===y; })[0] || {id:y, sales:{}, budget:{}, opening:0}; }
function balanceAt(m){ // cash on hand at the end of month m
  // Starts from the latest bank statement balance (start of a month) at or before m, then adds the ledger
  var p=plan(), y=m.slice(0,4), cp=p.checkpoints||{}, from=y+'-01', bal=+p.opening||0;
  Object.keys(cp).sort().forEach(function(k){ if(k<=m && k>=from){ from=k; bal=+cp[k]; } });
  FIN.data.fin_tx.forEach(function(t){ var tm=monthOf(t.date); if(tm>=from && tm<=m){ if(t.type==='in') bal+=+t.amount; if(t.type==='out') bal-=+t.amount; } });
  return bal;
}
function dealPaid(d){ return (+d.received||0)+FIN.data.fin_tx.filter(function(t){ return t.type==='in' && t.deal===d.id; }).reduce(function(s,t){ return s+(+t.amount||0); },0); }
function salesBooked(m){ return FIN.data.fin_deals.filter(function(d){ return monthOf(d.date)===m; }).reduce(function(s,d){ return s+dealFinal(d); },0); }
function salesYear(y){ return FIN.data.fin_deals.filter(function(d){ return String(d.date).slice(0,4)===y; }).reduce(function(s,d){ return s+dealFinal(d); },0); }
// What each client still owes: everything booked minus everything received, per client, so a payment logged in a later month still counts
function receivables(){
  var by={};
  FIN.data.fin_deals.forEach(function(d){ var k=d.client||'?', o=by[k]=by[k]||{left:0, d:d}; o.left+=dealFinal(d)-dealPaid(d); if(String(d.date)>=String(o.d.date)) o.d=d; });
  return Object.keys(by).map(function(k){ return by[k]; }).filter(function(x){ return x.left>0.5; }).sort(function(a,b){ return b.left-a.left; });
}
// Mongolian payroll, as in the studio's salary sheets: employee НДШ 11.5%, ХХОАТ 10% after НДШ minus the bracket credit, company НДШ 12.5%
function hhoatCredit(g){ if(g<=500000) return 20000; if(g<=1000000) return 18000; if(g<=1500000) return 16000; if(g<=2000000) return 14000; if(g<=2500000) return 12000; if(g<=3000000) return 10000; if(g<=3500000) return 8000; if(g<=4000000) return 6000; if(g<=4500000) return 4000; if(g<=5000000) return 2000; return 0; }
function payCalc(r){
  var wd=+r.wd||21, gross=(+r.base||0)*((+r.days||wd)/wd)+(+r.bonus||0), rep=+r.reported||0;
  var ndsh=Math.round(rep*0.115), hh=rep?Math.max(0, Math.round((rep-ndsh)*0.1)-hhoatCredit(rep)):0, comp=Math.round(rep*0.125);
  var ded=ndsh+hh+(+r.fund||0)+(+r.owed||0)+(+r.advance||0);
  return {gross:Math.round(gross), ndsh:ndsh, hhoat:hh, company:comp, deductions:ded, net:Math.round(gross-ded)};
}

function keepFin(){
  var md=S.modal, g=function(id){ var e=document.getElementById(id); return e?e.value:undefined; };
  if(md.kind==='ftx'){ md.amount=parseMoney(g('fa')); md.note=g('fn'); md.date=g('fd'); if(g('fcl')!=null) md.client=g('fcl'); if(g('frg')!=null) md.reg=g('frg'); if(g('fdl')!=null){ md.deal=g('fdl'); md.dealAuto=false; } }

}

function parseDeals(sh, hi, cName, cSale, out){
  var m=sheetMonth(sh.name, sh.rows) || (out.items.length?out.items[out.items.length-1].date.slice(0,7):null); if(!m) return;
  for(var r=hi+1;r<Math.min(sh.rows.length,hi+40);r++){
    var row=sh.rows[r]||[], name=row[cName]; if(name==null){ if(row[cSale]==null) break; continue; }
    name=String(name).trim(); if(/^(нийт|total)/i.test(name)) break;
    var booked=cellNum(row[cSale]), recv=cellNum(row[cSale+1]); if(!booked&&!recv) continue;
    out.deals.push({client:name, month:m, amount:Math.round(booked), received:Math.round(recv), on:true});
  }
}
function parsePayroll(sh, hi){
  var rows=sh.rows, H=rows[hi], S2=rows[hi+1]||[], m=sheetMonth(sh.name, rows); if(!m) return null;
  var c={days:findCol(H,['ажилласан хоног']), base:findCol(H,['үндсэн цалин']), bonus:findCol(H,['нэмэгдэл']), rep:findCol(H,['ндш-д тайлагнах цалин']), gross:findCol(H,['нийт бодогдсон']), pos:findCol(H,['албан тушаал']),
    ndsh:findCol(S2,['ндш']), fund:findCol(S2,['фондын сан']), owed:findCol(S2,['ажиллагсдын авлага']), adv:findCol(H,['урьдчилгаа'])};
  var body=[]; for(var r=hi+2;r<rows.length;r++){ var row=rows[r]||[]; if(nrm(row[0])==='нийт') break; if(typeof row[1]==='string' && row[1].trim()) body.push(row); }
  var wd=Math.max.apply(null, body.map(function(r){ return c.days>=0?cellNum(r[c.days]):0; }).concat([0]))||21;
  var list=body.map(function(row){ var g=function(k){ return c[k]>=0?cellNum(row[c[k]]):0; }, ndsh=g('ndsh'), base=g('base'), bonus=g('bonus'), days=g('days')||wd;
    if(g('gross') && Math.abs(base+bonus-g('gross'))<2) days=wd;
    return {name:row[1].trim(), position:c.pos>=0&&typeof row[c.pos]==='string'?row[c.pos]:'', base:base, days:days, bonus:bonus, reported:g('rep')||(ndsh?Math.round(ndsh/0.115):0), fund:g('fund'), owed:g('owed'), advance:g('adv'), wd:wd}; });
  return list.length?{month:m, rows:list, on:true}:null;
}

// The other side of a bank transfer, from text like "05-(5038118583-МОБИКОМ КОРПОРАЦИ)-> 04-(410080779-БРЭНД ОН ...)"
function bankParty(note){
  var re=/\((?:MN)?\d{6,}-\s*([^()]+?)\s*\)/g, m, out='';
  while((m=re.exec(note))){ if(!/БРЭНД ОН|BRAND ON/i.test(m[1])) { out=m[1].trim(); break; } }
  return out;
}
// ---------- the flow ----------
function fupFiles(fileList){
  var files=Array.prototype.slice.call(fileList||[]); if(!files.length) return;
  if(!FIN.unlocked){ toast(F('Эхлээд санхүүгээ нээнэ үү.','Open finance first.')); return; }
  FUP.busy=F('Уншиж байна...','Reading...'); FUP.notes=[]; render();
  var out={items:[], deals:[], pays:[], receipts:[], skipped:0, ignored:[]}, jobs=[];
  files.forEach(function(file){
    var n=file.name, low=n.toLowerCase();
    if(/\.xlsx$|\.xlsm$/.test(low)) jobs.push(file.arrayBuffer().then(readXlsx).then(function(sheets){ sheets.forEach(function(sh){ parseSheet(sh,n,out); }); }).catch(function(){ FUP.notes.push(n+': '+F('уншиж чадсангүй','could not read it')); }));
    else if(/\.csv$|\.txt$|\.tsv$/.test(low)) jobs.push(file.text().then(function(t){ parseSheet({name:n, rows:readCsv(t)},n,out); }));
    else if(/\.xls$/.test(low)) FUP.notes.push(n+': '+F('хуучин .xls формат. Excel-ээр нээгээд .xlsx болгож хадгална уу.','old .xls format. Open it in Excel and save as .xlsx.'));
    else if(/^image\//.test(file.type)) out.receipts.push({file:file, name:n, state:'wait'});
    else if(/pdf$/.test(low)) FUP.notes.push(n+': '+F('PDF-ийг уншихгүй. Баримтын зургийг эсвэл банкны хуулгын Excel-ийг оруулна уу.','PDFs are not read. Drop a photo of the receipt, or the bank statement as Excel.'));
    else FUP.notes.push(n+': '+F('танихгүй файл','not a file I know'));
  });
  Promise.all(jobs).then(function(){
    var learned=fLearn(), seen={}, perMonth={}, lastDay={};
    FIN.data.fin_tx.forEach(function(t){ var mm=monthOf(t.date); perMonth[mm]=(perMonth[mm]||0)+1; if(!lastDay[mm]||t.date>lastDay[mm]) lastDay[mm]=t.date; });
    FIN.data.fin_tx.forEach(function(t){ var k=t.date+'|'+(t.type==='move'?'out':t.type)+'|'+Math.round(+t.amount); seen[k]=(seen[k]||0)+1; });
    out.items.sort(function(a,b){ return a.date.localeCompare(b.date); });
    // The same payment can sit in the studio sheet and in the bank statement: count each date, amount and direction once across all files
    var perFile={};
    out.items.forEach(function(it){
      var g=guessCat(it.note+' '+it.client, it.type, it.hint, learned); it.cat=g.cat; it.sure=g.sure;
      if(it.cat==='cash'){ it.type='move'; }
      var k=it.date+'|'+(it.type==='move'?'out':it.type)+'|'+Math.round(it.amount), pf=perFile[it.file]=perFile[it.file]||{};
      pf[k]=(pf[k]||0)+1;
      if(pf[k]<=(seen[k]||0)) it.dup=true; else seen[k]=pf[k];
      // A month that is already filed is left unticked: the bank statement and the studio sheet record the same money in different detail
      // Weekly uploads: rows after the last filed day are new; rows inside an already filed stretch are left unticked
      if(!it.dup && (perMonth[it.date.slice(0,7)]||0)>=10 && it.date<=lastDay[it.date.slice(0,7)]) it.covered=true;
      if(it.type!=='move' && !OVERHEAD[it.cat]) it.deal=suggestDeal(it.note+' '+(it.client||''), it.date);
      it.on=!it.dup && !it.covered;
    });
    out.deals.forEach(function(d){ d.dup=FIN.data.fin_deals.some(function(x){ return monthOf(x.date)===d.month && Math.round(+x.amount)===d.amount && Math.round(+x.received||0)===d.received; }) || out.deals.indexOf(d)>out.deals.findIndex(function(y){ return y.month===d.month && y.amount===d.amount && y.received===d.received && nrm(y.client)===nrm(d.client); }); d.on=!d.dup; });
    out.pays.forEach(function(p){ p.dup=!!payrollFor(p.month); p.on=!p.dup; });
    FUP.items=out.items; FUP.deals=out.deals; FUP.pays=out.pays; FUP.receipts=FUP.receipts.concat(out.receipts);
    if(out.skipped) FUP.notes.push(F(out.skipped+' мөрөнд огноо алга тул алгаслаа.',out.skipped+' rows had no readable date and were skipped.'));
    if(out.ignored.length) FUP.notes.push(F('Таниагүй хуудас: ','Sheets not recognised: ')+out.ignored.slice(0,8).join(', ')+(out.ignored.length>8?'...':''));
    FUP.busy=''; render();
    fupAskClaude(); fupReceipts();
  });
}
// Rows no rule recognised go to Claude in one batch, when the page is allowed to ask
function fupAskClaude(){
  var unsure=FUP.items.filter(function(it){ return !it.sure && !it.dup; }).slice(0,80); if(!unsure.length || !window.claude) return;
  claude.use('sample').then(function(sample){
    if(!sample || !sample.json) return;
    FUP.busy=F('Claude ангилж байна...','Claude is sorting...'); render();
    var cats={in:FIN_IN.map(function(c){ return c.k+': '+c.mn; }), out:FIN_OUT.map(function(c){ return c.k+': '+c.mn; })};
    var prompt='You sort bank transactions of a Mongolian design agency into categories. Money in categories:\n'+cats.in.join('\n')+'\nMoney out categories:\n'+cats.out.join('\n')+
      '\nReturn JSON: {"cats":[category key for each transaction, same order]}. Use only keys from the right list for its type. Transactions:\n'+unsure.map(function(it,i){ return i+'. '+it.type+' '+Math.round(it.amount)+' MNT: '+it.note.slice(0,160); }).join('\n');
    return sample.json(prompt, {modelTier:'quick'}).then(function(res){
      var arr=res&&res.cats||[]; unsure.forEach(function(it,i){ var k=arr[i], ok=(it.type==='in'?FIN_IN:FIN_OUT).some(function(c){ return c.k===k; }); if(ok){ it.cat=k; it.sure=1; it.ai=true; } });
    });
  }).catch(function(){}).then(function(){ FUP.busy=''; if(S.view==='finance') render(); });
}
// Receipt photos: Claude reads date, amount and shop, then the matching expense is marked as having its receipt
function fupReceipts(){
  var wait=FUP.receipts.filter(function(r){ return r.state==='wait'; }); if(!wait.length) return;
  if(!window.claude){ wait.forEach(function(r){ r.state='manual'; }); render(); return; }
  claude.use('sample').then(function(sample){
    if(!sample){ wait.forEach(function(r){ r.state='manual'; }); render(); return; }
    return sample.limits().then(function(lim){
      if(!lim || !lim.images){ wait.forEach(function(r){ r.state='manual'; }); render(); return; }
      return wait.reduce(function(p,r){ return p.then(function(){ r.state='reading'; render();
        return sample.json('This is a photo of a receipt or invoice (likely Mongolian). Return JSON {"date":"YYYY-MM-DD or null","amount":total paid as a number in MNT or null,"vendor":"shop or company name or null"}.', {images:[r.file], modelTier:'quick'})
          .then(function(j){ r.date=j&&j.date||null; r.amount=j&&+j.amount||0; r.vendor=j&&j.vendor||''; r.match=fupMatch(r); r.state='read'; })
          .catch(function(){ r.state='manual'; }); }); }, Promise.resolve()).then(function(){ render(); });
    });
  }).catch(function(){ wait.forEach(function(r){ r.state='manual'; }); render(); });
}
function fupMatch(r){
  if(!r.amount) return '';
  var c=FIN.data.fin_tx.filter(function(t){ return t.type==='out' && Math.abs(+t.amount-r.amount)<1 && t.receipt!=='done'; });
  if(r.date) c.sort(function(a,b){ return Math.abs(fromIso(a.date)-fromIso(r.date))-Math.abs(fromIso(b.date)-fromIso(r.date)); });
  c.sort(function(a,b){ return (b.receipt==='todo')-(a.receipt==='todo'); });
  return c.length?c[0].id:'';
}
function fupCommit(){
  var tx=FUP.items.filter(function(it){ return it.on; }), deals=FUP.deals.filter(function(d){ return d.on; }), pays=FUP.pays.filter(function(p){ return p.on; });
  var docs=[], now=new Date().toISOString();
  tx.forEach(function(it){ docs.push(['fin_tx',{id:newId('f'), created:now, type:it.type, amount:it.amount, cat:it.cat, note:it.note, date:it.date, account:'bank', client:it.client||'', reg:it.reg||'', work:it.work||'', deal:it.type==='move'?'':(it.deal||''), vat:it.type==='in'?(it.vat||'none'):'none', receipt:it.type==='out'?(it.receipt||'none'):'none', by:S.me, src:'upload'}]); });

  pays.forEach(function(p){

      if(!s){ s={id:newId('s'), name:r.name, position:r.position, base:r.base, reported:r.reported, fund:r.fund, order:FIN.data.fin_staff.length+1, bonus:false, left:false}; FIN.data.fin_staff.push(s); docs.push(['fin_staff',s]); }
      return {staff:s.id, base:r.base, days:r.days, bonus:r.bonus, reported:r.reported, fund:r.fund, owed:r.owed, advance:r.advance, wd:r.wd}; });
    docs.push(['fin_payroll',{id:p.month, rows:rows, paid:true}]);

  if(!docs.length) return;

  FUP.items=[]; FUP.deals=[]; FUP.pays=[]; FUP.busy=F('Хадгалж байна...','Saving...'); render();

    .then(function(){ FUP.busy=''; render(); toast(F(docs.length+' зүйл нэмэгдлээ','Added '+docs.length+' items')); if(tx.length) FIN.month=monthOf(tx[tx.length-1].date); })
    .catch(function(){ FUP.busy=''; render(); toast(F('Зарим нь хадгалагдсангүй. Дахин оролдоно уу.','Some items did not save. Try again.')); });
}

var CLIENT_ALIAS={'pizza hut':['пицца','pizza'],'emart':['имарт','emart','e-mart'],'mobicom':['мобиком','mobicom'],'max group':['макс','max'],'unitel':['юнител','unitel'],'kakumi':['какуми','kakumi'],'hairan':['хайран','hairan'],'milkman':['милкмэн','milkman'],'pinuta':['пинута','pinuta'],'pmc':['pmc'],'sisu':['sisu','сису'],'paradox':['paradox','парадокс','юү кэй эс']};
function clientTokens(name){
  var n=nrm(name), t=(CLIENT_ALIAS[n]||[]).slice();
  n.replace(/[^a-zа-яөүё0-9\s.]/g,' ').split(/\s+/).forEach(function(w){ if(w.length>=3 && !/^(ххк|llc|ltd|групп|group|компани)$/.test(w) && t.indexOf(w)<0) t.push(w); });
  return t.slice(0,3);
}
// A name must start a word; short names (3 letters) must be the whole word, so "шим" never matches "шимтгэл"
function tokenIn(s,w){ var re=new RegExp('(^|[^a-zа-яөүё0-9])'+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+(w.length<4?'($|[^a-zа-яөүё0-9])':''),'i'); return re.test(s); }
function suggestDeal(text, date){
  var s=nrm(text); if(!s) return '';
  var best=null, bestScore=-1;
  FIN.data.fin_deals.forEach(function(d){
    var tok=clientTokens(d.client), hit=tok.some(function(w){ return tokenIn(s,w); }); if(!hit) return;
    if((fromIso(String(d.date).slice(0,10))-fromIso(date||iso(TODAY)))/864e5>45) return;
    var gap=Math.abs(fromIso(String(d.date).slice(0,10))-fromIso(date||iso(TODAY)))/864e5, score=1000-gap-(d.status==='cancelled'||d.status==='done'?200:0)-(String(d.date)>String(date)?60:0);
    if(score>bestScore){ bestScore=score; best=d; }
  });
  return best?best.id:'';
}

// ================= What should this person do next? =================
function rank(t){ if(changesAsked(t)) return 0; if(t.status==='doing') return 1+days(t.due)/100; if(t.status==='todo') return 2+days(t.due)/100; return 9; }
function verb(t){
  if(changesAsked(t)) return {label:L('Send fixed version'), act:'submit'};
  if(t.status==='doing') return {label:L('Send your work'), act:'submit'};
  if(t.status==='todo') return {label:L('Start'), act:'start'};
  return null;
}
function sentence(t){
  if(changesAsked(t)) return L('{name} asked for changes',{name:pmOf(t).name});
  if(t.status==='doing') return L('You are working on this');
  if(t.status==='todo') return L('Not started yet');
  if(t.status==='review') return L('Waiting for {name} to review',{name:pmOf(t).name});
  return L('Approved');
}
function home(){ return isExec()?'dash':isPM()?'needs':'home'; }
function greeting(){
  var h=new Date().getHours();
  if(h>=5&&h<11) return L('Good morning');
  if(h>=11&&h<17) return L('Good afternoon');
  if(h>=17&&h<23) return L('Good evening');
  return L('Working late');
}

// ================= Images =================
function imgUrl(f){ var u=String(f&&f.url||''); return (/^https:\/\//i.test(u)||/^data:image\//i.test(u))?u:''; }
function cover(t){
  var v=last(t); if(!v) return null;
  var f=v.files.filter(function(f){return f.kind==='image'&&imgUrl(f);})[0];
  if(f) return {src:imgUrl(f)};
  var dr=v.files.filter(function(f){return f.kind==='drive';})[0];
  if(dr) return {src:'https://drive.google.com/thumbnail?id='+encodeURIComponent(dr.id)+'&sz=w1200', drive:true};
  return null;
}
function coverHtml(t, ph){
  var c=cover(t);
  if(!c) return ph||'<div class="ph">'+ICON.link+'</div>';
  return (c.drive?'<div class="ph">'+ICON.drive+'</div>':'')+'<img src="'+esc(c.src)+'" alt="" loading="lazy"'+(t.sample?' class="sample"':'')+(c.drive?' data-fallback':'')+'>';
}

function wavy(frac, label){
  // Spectrum meter: a straight 4px track with the filled part in the accent
  var pc=Math.round(Math.max(0,Math.min(1,frac))*100);
  return '<div class="wavy" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pc+'" aria-label="'+esc(label||(pc+'%'))+'"><span class="meter-t"><span style="width:'+pc+'%"></span></span>'+(label?'<b>'+esc(label)+'</b>':'')+'</div>';
}

// Month view: the whole month at a glance, Monday first, up to three events a day and a count for the rest
function monthBlock(mref){
  var first=new Date(mref.getFullYear(), mref.getMonth(), 1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
  var last=new Date(mref.getFullYear(), mref.getMonth()+1, 0), cells=Math.ceil((((first.getDay()+6)%7)+last.getDate())/7)*7, ev=allEvents(), edit=!S.readonly;
  var head='<div class="mon-h">'+[0,1,2,3,4,5,6].map(function(i){ var x=new Date(start); x.setDate(start.getDate()+i); return '<span>'+esc(dow(x))+'</span>'; }).join('')+'</div>';
  var body='';
  for(var i=0;i<cells;i++){
    var x=new Date(start); x.setDate(start.getDate()+i);
    var di=iso(x), list=ev.filter(function(e){ return e.date===di; }), isT=di===iso(TODAY), out=x.getMonth()!==mref.getMonth(), past=x<TODAY&&!isT;
    body+='<div class="mon-d'+(isT?' today':'')+(out?' out':'')+(past?' past':'')+'"><div class="mon-n">'+(edit?'<button class="mon-add" data-act="newevent" data-date="'+di+'" aria-label="'+esc(L('Add to planner')+' '+md(x))+'">'+x.getDate()+'</button>':'<span>'+x.getDate()+'</span>')+'</div>'+
      list.slice(0,3).map(function(e){ var k=KINDS[e.kind]||KINDS.meeting, t=(e.time?e.time+' ':'')+e.title;
        return edit?'<button class="mon-e" style="--k:'+k.color+'" data-act="'+(e.auto?'evauto':'editevent')+'" data-id="'+esc(e.auto?e.task:e.id)+'" title="'+esc(t+' · '+whoLine(e))+'">'+esc(t)+'</button>':'<span class="mon-e" style="--k:'+k.color+'" title="'+esc(t)+'">'+esc(t)+'</span>'; }).join('')+
      (list.length>3?'<button class="mon-more" data-act="calweek" data-date="'+di+'">'+esc(L('+{n} more',{n:list.length-3}))+'</button>':'')+'</div>';
  }
  return '<div class="mon">'+head+'<div class="mon-g">'+body+'</div></div>';
}

function frameHtml(content, entering){

function railHtml(ws){

// ---------- selection ----------
// Existing rows already say what they are (data-act + data-id); the frame reads that, so every list joins the same model
var SEL_KIND={info:'task', openreview:'task', evauto:'task', openproj:'project', editevent:'event', selperson:'person', ftxedit:'tx', fdeal:'deal'};
function selKey(k,id){ return k+':'+id; }
function isSel(k,id){ return S.sel.some(function(s){ return s.k===k && s.id===id; }); }
function selectEl(el, ev){
  var k=SEL_KIND[el.dataset.act], id=el.dataset.id; if(!k||!id) return false;
  if(ev && (ev.shiftKey||ev.metaKey||ev.ctrlKey) && S.sel.length && S.sel[0].k===k){
    if(ev.shiftKey){ var all=selectables(k), a=all.findIndex(function(x){ return x.dataset.id===S.sel[S.sel.length-1].id; }), b=all.findIndex(function(x){ return x===el; });
      if(a>=0&&b>=0){ var lo=Math.min(a,b), hi=Math.max(a,b); all.slice(lo,hi+1).forEach(function(x){ if(!isSel(k,x.dataset.id)) S.sel.push({k:k,id:x.dataset.id}); }); } }
    else if(isSel(k,id)) S.sel=S.sel.filter(function(s){ return !(s.k===k&&s.id===id); });
    else S.sel.push({k:k,id:id});
  } else S.sel=[{k:k,id:id}];
  render(); return true;

  var r=target.getBoundingClientRect(), c=cv.getBoundingClientRect(), bw=bar.offsetWidth, bh=bar.offsetHeight;
  // hang the bar from the selected item's bottom edge, so it reads as part of it even in tight lists

  // projects

  if(a==='editproj'){ var pp=project(id); openModal({kind:'proj', id:pp.id, client:pp.client, name:pp.name, pm:pp.pm, drive:pp.drive, deadline:pp.deadline, contact:pp.contact, brief:pp.brief, type:pp.type}); return; }
  if(a==='ptype'){ keep(); S.modal.type=b.dataset.k; renderModal(); return; }
  if(a==='pevery'){ keep(); S.modal.every=b.dataset.k; renderModal(); return; }
  if(a==='archive'){ var ap=project(S.modal.id); ap.archived=!ap.archived; persist('projects',ap); S.modal=null; S.trail=[]; go('projects'); toast(L(ap.archived?'Moved to the archive':'Restored from the archive')); return; }
  if(a==='deliver'){ openModal({kind:'deliver', id:id}); return; }
  if(a==='savedeliver'){ var dl=$('#dl').value.trim(); if(dl && !safeUrl(dl)){ $('#derr').textContent=L("That doesn't look like a link."); return; } var dpp=project(S.modal.id); dpp.delivered={at:iso(TODAY), by:S.me, link:safeUrl(dl)}; persist('projects',dpp); S.modal=null; render(); stamp(L('DELIVERED'), false); toast(L('Delivered. Nice work, team.')); return; }
  if(a==='undeliver'){ var up=project(id); delete up.delivered; persist('projects',up); render(); return; }
  if(a==='thread'){ openModal({kind:'thread', id:id}); setTimeout(function(){ var th=document.querySelector('.thread'); if(th) th.scrollTop=th.scrollHeight; },40); return; }
  if(a==='sendq'){ var qt=$('#qx').value.trim(); if(!qt){ $('#qx').focus(); return; } var qtk=task(S.modal.id); qtk.thread=(qtk.thread||[]).concat([{by:S.me, text:qt, at:new Date().toISOString()}]); persist('tasks',qtk); renderModal(); setTimeout(function(){ var th=document.querySelector('.thread'); if(th) th.scrollTop=th.scrollHeight; var q=$('#qx'); if(q) q.focus(); },30); return; }
  if(a==='tg'){ connectTelegram(); S.menu=false; render(); return; }
  if(a==='resetpin'){ var rp=person(id); delete rp.pinHash; persist('people',rp); render(); toast(L('PIN reset. {name} creates a new one next time.',{name:rp.name})); return; }
  if(a==='export'){ exportCsv(); return; }
  if(a==='ppm'){ keep(); S.modal.pm=id; renderModal(); return; }
  if(a==='saveproj'){ keep(); var pm2=S.modal, cl=(pm2.client||'').trim(); if(!cl){ $('#perr2').textContent=L('Write the client name.'); $('#pc').focus(); return; }
    var pf={client:cl, name:(pm2.name||'').trim(), pm:pm2.pm||(isPM()?S.me:((S.people.filter(function(p){return p.role==='pm';})[0])||{}).id), drive:safeUrl(pm2.drive), deadline:pm2.deadline||'', contact:(pm2.contact||'').trim(), brief:(pm2.brief||'').trim()};
    if(pm2.id){ var ep=project(pm2.id); Object.assign(ep,pf); persist('projects',ep); S.modal=null; render(); toast(L('Project saved')); return; }
    var ty=pm2.type||'custom', npj=Object.assign({id:newId('p'), color:COLORS[(S.projects.length+1)%COLORS.length], created:iso(TODAY), type:ty}, pf);
    if(ty==='social') npj.recur={every:pm2.every||'week', items:TEMPLATES.social.recur.map(function(r){ return [L(r[0]), r[1]]; }), last:''};
    add('projects', npj);
    var made=templateTasks(ty, pf.deadline, npj.id, npj.pm); made.forEach(function(t){ add('tasks',t); });
    if(npj.recur) runRecurring();
    S.modal=null; S.project=npj.id; pushGo('project'); toast(made.length?L('Project created with {n} tasks',{n:made.length}):L('Project created')); return; }
  if(a==='rmproj'){ var gp=project(S.modal.id), gts=S.tasks.filter(function(x){return x.project===gp.id;});
    destroy('projects',gp.id); gts.forEach(function(x){ destroy('tasks',x.id); }); S.modal=null; S.trail=[]; go('projects');
    toast(L('Project deleted'), function(){ add('projects',gp); gts.forEach(function(x){ add('tasks',x); }); }); return; }
  // team
  if(a==='prole'){ var nv=$('#np').value; S.prole=b.dataset.r; render(); $('#np').value=nv; return; }
  if(a==='rmperson'){ var gpp=person(id); destroy('people',id); render(); toast(L('Removed {name}',{name:gpp.name}), function(){ add('people',gpp); }); return; }
});
function stamp(text, back){
  if(RM) return;
  var w=document.createElement('div'); w.className='stamp-wrap'; w.innerHTML='<div class="stamp'+(back?' back':'')+'">'+esc(text)+'</div>';
  document.body.appendChild(w); setTimeout(function(){ w.style.transition='opacity .25s'; w.style.opacity='0'; setTimeout(function(){ w.remove(); },260); }, 820);
}
function openTask(t){ if(!t) return; openModal({kind:'task', id:t.id, title:t.title, who:t.who, due:t.due, project:t.project, brief:t.brief, shoot:t.shoot, shootOn:!!t.shoot, more:!!t.brief}); }
document.addEventListener('change', function(e){
  if(!S.modal) return;
  if(e.target.id==='tdate'){ keep(); S.modal.due=e.target.value||S.modal.due; renderModal(); return; }
  if(e.target.id==='tshoot'){ keep(); renderModal(); var sp=$('#tshootp'); if(sp) sp.focus(); return; }
});
document.addEventListener('input', function(e){
  if(e.target.dataset && e.target.dataset.link!=null){ // live check of pasted links
    var row=e.target.parentNode, pl=parseLink(e.target.value), ch=row.querySelector('.chip');
    if(!ch){ ch=document.createElement('span'); row.insertBefore(ch, e.target.nextSibling); }
    if(!e.target.value){ ch.remove(); return; }
    ch.className='chip '+(pl?(pl.kind==='drive'?'ok':''):'red');
    ch.innerHTML=pl?(pl.kind==='drive'?ICON.check+esc(L('Drive file')):pl.kind==='folder'?esc(L('Drive folder')):esc(L('Link'))):'!';
  }
});
document.addEventListener('error', function(e){ var el=e.target; if(el && el.hasAttribute && el.hasAttribute('data-fallback')) el.remove(); }, true);
document.addEventListener('submit', function(e){
  var f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='fincode'){ var code=$('#fcode').value; if(!code){ $('#fcode').focus(); return; } unlockFinance(code).catch(function(e){ var m=String(e&&e.message||'');
    if(m==='confirm'){ render(); setTimeout(function(){ var x=$('#fcode'); if(x) x.focus(); },30); return; }
    var msg=m==='mismatch'?F('Хоёр код таарсангүй. Дахин эхэлнэ үү.','The two codes did not match. Start again.'):m==='denied'?F('Энэ хуудсан дээр санхүү харах эрх танд алга. Эзэмшигч таныг Editor болгох хэрэгтэй.','You cannot read finance on this page. The owner needs to make you an Editor.'):m==='offline'?F('Санхүү энд нээгдэхгүй.','Finance does not open here.'):F('Код буруу байна.','That code is not right.');
    if(m==='mismatch') render(); var er=$('#fcerr'); if(er) er.textContent=msg; var x=$('#fcode'); if(x){ x.value=''; x.focus(); } }); return; }
  if(f.dataset.form==='studio'){ var pw=$('#spw').value; if(!pw){ $('#spw').focus(); return; } $('#lerr').textContent=''; studioLogin(pw).catch(function(){ $('#lerr').textContent=L('That password is not right.'); }); return; }
  if(f.dataset.form==='ann'){ var ti=$('#at').value.trim(), tx=$('#ax').value.trim(); if(!ti){ $('#aerr').textContent=L('Give it a title.'); $('#at').focus(); return; }
    add('ann',{id:newId('a'), by:S.me, date:iso(TODAY), title:ti, text:tx, aud:S.aud, seen:{}}); render(); toast(L('Announced. It shows at the top of everyone\'s page.')); return; }
  if(f.dataset.form==='person'){ var n=$('#np').value.trim(); if(!n){ $('#perr').textContent=L('Write a name.'); return; }
    add('people',{id:newId('p'), name:n, role:S.prole||'designer', color:COLORS[S.people.length%COLORS.length]}); render(); return; }
  if(f.dataset.form==='comment'){
    var txt=$('#ct').value.trim(); if(!txt){ $('#ct').focus(); return; }
    var tr=task(S.task), v=last(tr), c={by:S.me, text:txt}, ts=$('#cts');
    if(S.pending){ c.x=+S.pending.x.toFixed(2); c.y=+S.pending.y.toFixed(2); c.file=S.pending.file; }
    if(ts && ts.value.trim()) c.t=ts.value.trim();
    v.comments.push(c); S.pending=null; S.marking=false; persist('tasks',tr); render();
  }
});
function openPalette(){ S.menu=false; S.palette={q:'', i:0}; render(); }
function runPal(i){
  var it=(S.palItems||[])[i]; if(!it) return; S.palette=null; renderPalette();
  var fake={dataset:{v:it.arg, l:it.arg, id:it.arg}, disabled:false, closest:function(){return null;}};
  if(it.run==='go'){ S.trail=[]; go(it.arg); return; }
  if(it.run==='lang'){ LANG=it.arg; try{ localStorage.setItem('bo.lang',LANG); }catch(x){} document.documentElement.lang=LANG; render(); return; }
  if(it.run==='openreview'){ S.task=it.arg; S.ver=null; pushGo('review'); return; }
  if(it.run==='openproj'){ S.project=it.arg; pushGo('project'); return; }
  if(it.run==='info'){ openTask(task(it.arg)); return; }
  if(it.run==='pick'){ if(S.hosted){ openModal({kind:'pin', id:it.arg}); focusPin(); return; } enterAs(it.arg); return; }
  var btn=document.createElement('button'); btn.dataset.act=it.run; if(it.arg) btn.dataset.id=it.arg; btn.style.display='none'; document.body.appendChild(btn); btn.click(); btn.remove();
}
function typing(){ var a=document.activeElement; return a && (/INPUT|TEXTAREA|SELECT/.test(a.tagName) || a.isContentEditable); }
document.addEventListener('input', function(e){ if(e.target.id==='palq'){ S.palette.q=e.target.value; S.palette.i=0; renderPalette(); } });
document.addEventListener('keydown', function(e){
  var k=e.key, mod=e.metaKey||e.ctrlKey;
  if(mod && (k==='k'||k==='K')){ e.preventDefault(); if(S.palette){ S.palette=null; renderPalette(); } else if(S.me) openPalette(); return; }
  if(S.palette){
    if(k==='Escape'){ e.preventDefault(); S.palette=null; renderPalette(); return; }
    if(k==='ArrowDown'){ e.preventDefault(); S.palette.i=Math.min((S.palItems||[]).length-1,S.palette.i+1); renderPalette(); return; }
    if(k==='ArrowUp'){ e.preventDefault(); S.palette.i=Math.max(0,S.palette.i-1); renderPalette(); return; }
    if(k==='Enter'){ e.preventDefault(); runPal(S.palette.i); return; }
    return;
  }
  if(k==='Escape'){
    if(S.modal){ closeModal(); return; }
    if(S.menu){ S.menu=false; render(); return; }
    if(S.fab){ S.fab=false; render(); return; }
    if(S.pending||S.marking){ S.pending=null; S.marking=false; render(); return; }
    if(S.view==='review'||S.view==='project'||S.view==='settings'){ go(S.trail.pop()||home()); return; }
    return;
  }
  if(typing() || S.modal || mod || e.altKey) return;
  if(!S.me){ if(/^[1-9]$/.test(k)){ var ps=document.querySelectorAll('.person'); var b=ps[+k-1]; if(b) b.click(); } return; }
  if(k==='/'){ e.preventDefault(); openPalette(); return; }
  if(k==='?'){ openModal({kind:'keys'}); return; }
  if(S.view==='review'){
    var t=task(S.task); if(!t) return;
    if(k==='ArrowLeft'||k==='ArrowRight'){ var vi=S.ver==null?t.versions.length-1:S.ver; vi=Math.max(0,Math.min(t.versions.length-1,vi+(k==='ArrowLeft'?-1:1))); S.ver=vi; S.pending=null; S.compare=false; render(); return; }
    var q=function(sel){ var b=document.querySelector(sel); if(b&&!b.disabled) b.click(); };
    if(k==='a'||k==='A'){ q('[data-act=approve]'); return; }
    if(k==='s'||k==='S'){ q('[data-act=changes]'); return; }
    if(k==='m'||k==='M'){ q('[data-act=mark]'); return; }
    return;
  }
  if((k==='n'||k==='N') && !S.readonly){ openModal({kind:'task', project:(S.view==='project'?S.project:((S.projects.filter(function(p){return p.pm===S.me;})[0]||S.projects[0]||{}).id)), due:iso(d(nextFriday()))}); return; }
  if(k==='Enter' && S.view==='home'){ var hb=document.querySelector('.focus-a .btn.primary'); if(hb){ e.preventDefault(); hb.click(); } }
});

document.documentElement.lang=LANG;
boot();
})();
</script>
</body>
