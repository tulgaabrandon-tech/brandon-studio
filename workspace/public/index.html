<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BrandOn Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400..900&display=swap" rel="stylesheet">
<meta name="theme-color" content="#DA1F34">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ================= BrandOn Studio: visual system =================
   Neutral paper and ink. Red only for action, urgency and focus.
   Flat for reading, soft for touching, glass for what floats. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#FAF9F6; --sunk:#ECEAE4;
  --ink:#141414; --ink-2:#3B3A37; --muted:#68655F; --faint:#A8A49C;
  --line:rgba(20,20,20,.08); --line-2:rgba(20,20,20,.15);
  --red:#DA1F34; --red-ink:#B3172A; --red-soft:#FBE8EA; --red-glow:rgba(218,31,52,.28);
  --ok:#1D7552; --ok-soft:#E3F2EA; --warn:#8F5B00; --warn-soft:#FAEFD9;
  --info:#2F5DA8; --info-soft:#E7EEF9;
  --r-s:10px; --r:14px; --r-l:22px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(20,20,20,.05);
  --sh-2:0 1px 2px rgba(20,20,20,.04),0 10px 30px -14px rgba(20,20,20,.18);
  --sh-pop:0 30px 80px -20px rgba(20,20,20,.35),0 2px 10px rgba(20,20,20,.08);
  --soft-up:3px 3px 8px rgba(20,20,20,.08),-3px -3px 8px rgba(255,255,255,.9);
  --soft-in:inset 2px 2px 5px rgba(20,20,20,.09),inset -2px -2px 5px rgba(255,255,255,.85);
  --glass:rgba(244,243,239,.72);
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.22,1,.36,1);
  --font:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
body.dark{
  --bg:#0F0F10; --surface:#18181A; --surface-2:#1E1E21; --sunk:#141416;
  --ink:#F3F2EE; --ink-2:#D2D0CB; --muted:#A09D97; --faint:#6C6A66;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --red:#E8273D; --red-ink:#FF6B7C; --red-soft:rgba(232,39,61,.16); --red-glow:rgba(232,39,61,.35);
  --ok:#4CC08C; --ok-soft:rgba(76,192,140,.14); --warn:#E5B04A; --warn-soft:rgba(229,176,74,.14);
  --info:#86A9EC; --info-soft:rgba(134,169,236,.14);
  --sh-1:0 1px 0 rgba(255,255,255,.03);
  --sh-2:0 1px 0 rgba(255,255,255,.04),0 14px 34px -16px rgba(0,0,0,.6);
  --sh-pop:0 30px 80px -20px rgba(0,0,0,.7);
  --soft-up:3px 3px 8px rgba(0,0,0,.45),-2px -2px 6px rgba(255,255,255,.04);
  --soft-in:inset 2px 2px 5px rgba(0,0,0,.5),inset -2px -2px 5px rgba(255,255,255,.04);
  --glass:rgba(15,15,16,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11";transition:background .3s var(--ease),color .3s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.s13{font-size:13px}
.red{color:var(--red-ink)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- type ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.display{font-size:clamp(40px,6vw,76px);line-height:.98;font-weight:800;letter-spacing:-.045em;margin:10px 0 0}
.display .dot{color:var(--red)}
.h2{font-size:clamp(28px,3.4vw,44px);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:0}
.lede{font-size:18px;line-height:1.5;color:var(--muted);margin:14px 0 0;max-width:640px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:52px 0 14px}
.sec h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.sec .muted{font-size:13px}
kbd{font:600 11px/1 var(--font);min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface-2)}
.btn.primary kbd{border-color:rgba(255,255,255,.35);color:rgba(255,255,255,.85);background:rgba(255,255,255,.12)}

/* ---------- layout ---------- */
.page{max-width:1120px;margin:0 auto;padding:44px 28px 120px}
.page.enter > *{animation:rise .5s var(--ease) both}
.page.enter > *:nth-child(2){animation-delay:.04s}.page.enter > *:nth-child(3){animation-delay:.08s}.page.enter > *:nth-child(4){animation-delay:.12s}.page.enter > *:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.demo-bar{background:var(--ink);color:var(--bg);text-align:center;font-size:13px;font-weight:600;padding:8px 16px}
.demo-bar.warn{background:var(--red);color:#fff}

/* ---------- top bar (glass) ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
@supports (backdrop-filter:blur(1px)){.topbar{background:var(--glass);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}}
.bar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-weight:400}
.mark{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface);box-shadow:var(--sh-1);border:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--sunk);box-shadow:var(--soft-in)}
.tabs button{min-height:36px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:8px;transition:color .2s,background .2s,box-shadow .2s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current]{background:var(--surface);color:var(--ink);box-shadow:var(--soft-up)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px 0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;min-width:200px;box-shadow:var(--sh-1)}
.search:hover{border-color:var(--line-2);color:var(--ink)}
.search span{flex:1;text-align:left}
.userbtn{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px 0 4px;border-radius:12px;font-weight:650;font-size:14px}
.userbtn:hover{background:var(--surface)}
.menu-w{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:300px;padding:8px;border-radius:18px;z-index:40;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);display:flex;flex-direction:column;gap:2px;animation:pop .22s var(--spring) both;transform-origin:top right}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(-4px)}to{opacity:1;transform:none}}
.menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 10px;font-size:14px;font-weight:650}
.menu-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:12px;font-size:14px;font-weight:550;text-align:left;white-space:nowrap}
.menu-item:hover{background:var(--surface-2)}
.menu-item kbd{margin-left:auto}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:650;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);text-decoration:none;transition:transform .12s var(--ease),background .2s,border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 8px 20px -10px var(--red-glow)}
.btn.primary:hover{background:var(--red-ink);border-color:var(--red-ink)}
body.dark .btn.primary:hover{background:#FF3D53;border-color:#FF3D53}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface);border-color:var(--line)}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.xl{min-height:52px;padding:0 22px;font-size:15px;border-radius:14px}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn .i{width:17px;height:17px}
a.btn{text-decoration:none}
.lnk{color:var(--red-ink);font-weight:700;font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn.sm{width:32px;height:32px;border-radius:9px}
.icon-btn.sm .i{width:15px;height:15px}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--sunk);box-shadow:var(--soft-in)}
.seg button{min-height:32px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--soft-up)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink-2);transition:all .15s var(--ease)}
.pick:hover{border-color:var(--line-2)}
.pick[aria-pressed="true"],.pick.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick small{font-size:11px;opacity:.65;font-weight:500}
.pick.sm{min-height:36px;padding:0 10px;font-size:13px}
.kdot{width:9px;height:9px;border-radius:3px;display:inline-block}
.input{width:100%;min-height:46px;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:15px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
textarea.input{min-height:96px;resize:vertical;line-height:1.5}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.input.sm{min-height:38px;font-size:13px}
.err{color:var(--red-ink);font-size:13px;font-weight:600;margin:0;min-height:0}
.err:empty{display:none}

/* ---------- chips, avatars, dots ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.8}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip .i{width:13px;height:13px}
.av,.av-lg,.av-xl{border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;letter-spacing:-.02em;box-shadow:inset 0 -6px 12px rgba(0,0,0,.12)}
.av{width:30px;height:30px;font-size:12px}
.av-lg{width:56px;height:56px;font-size:20px}
.av-xl{width:84px;height:84px;font-size:30px}
.avs{display:flex}.avs > *{margin-left:-8px;border:2px solid var(--surface);border-radius:50%}.avs > *:first-child{margin-left:0}
.pdot{width:10px;height:10px;border-radius:3px;flex:none}

/* ---------- cards & rows ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1)}
.rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:var(--sh-1)}
.rw{display:flex;align-items:center;gap:14px;min-height:68px;padding:10px 18px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .15s}
.rows > .rw:first-child{border-top:0}
.rw:hover{background:var(--surface-2)}
.rw.dim{opacity:.5}
.rw-m{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:left}
.rw-m b{font-size:15px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rw-m .muted{font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.rw-m:hover b{text-decoration:underline;text-underline-offset:3px}
.rw > .btn{flex:none}
.rw-btn > .chip{width:146px;justify-content:center;flex:none}
.rw .dt{width:42px;text-align:center;flex:none;display:flex;flex-direction:column}
.rw .dt b{font-size:11px;color:var(--red-ink);letter-spacing:.06em}
.rw .dt span{font-size:20px;font-weight:800;line-height:1.1}
.ev{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;padding:2px 0 2px 12px;border-left:3px solid var(--k)}
.ev b{font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted);border:1.5px dashed var(--line-2);border-radius:var(--r-l)}
details.done{margin-top:28px}
details.done > summary{cursor:pointer;list-style:none;min-height:44px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--muted)}
details.done > summary::before{content:"+";font-weight:800;width:16px}
details.done[open] > summary::before{content:"-"}
details.done > .rows{margin-top:8px}

/* ---------- announcements ---------- */
.anns{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.ann{display:flex;gap:16px;align-items:center;padding:16px 16px 16px 18px;border-radius:var(--r-l);background:var(--ink);color:var(--bg);animation:rise .5s var(--ease) both}
.ann b{font-size:15px;font-weight:750}
.ann p{margin:2px 0 0;font-size:14px;opacity:.78;line-height:1.45}
.ann .meta{font-size:12px;opacity:.55;margin-top:4px}
.ann .btn{background:var(--bg);color:var(--ink);border-color:transparent}
.ann-ic{width:40px;height:40px;border-radius:12px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ann-ic.sm{width:34px;height:34px;border-radius:10px}

/* ---------- focus card (next task) ---------- */
.focus{margin-top:28px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);border-radius:var(--r-xl);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2)}
.focus-b{padding:36px 36px 32px;display:flex;flex-direction:column;gap:16px}
.focus-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:700}
.focus-top .tp-link{margin-left:auto}
.tp-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;color:var(--muted);text-decoration:none}
.tp-link:hover{color:var(--ink)}
.state{font-size:15px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.state.red{color:var(--red-ink)}
.state.ok{color:var(--ok)}
.state .pulse{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 50%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.notes-l{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.notes-l li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.5}
.num{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.brief{font-size:15px;line-height:1.6;color:var(--ink-2);margin:0}
.focus-a{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:8px}
.focus-m{position:relative;background:var(--sunk);min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.focus-m img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:transform .6s var(--ease)}
.focus-m:hover img{transform:scale(1.03)}
.focus-m .tag{position:absolute;left:16px;bottom:16px;z-index:2}
.focus-m .ph{display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:600}
.focus-m .ph .i{width:40px;height:40px;stroke-width:1.4}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-size:12px;font-weight:750;background:rgba(20,20,20,.72);color:#fff;backdrop-filter:blur(10px)}
.tag.red{background:var(--red)}
.shoot{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}

/* hint */
.hint-pop{display:flex;align-items:center;gap:14px;justify-content:space-between;background:var(--red);color:#fff;border-radius:14px;padding:12px 12px 12px 18px;font-size:14px;font-weight:600;margin-top:24px;position:relative;animation:rise .5s var(--ease) both}
.hint-pop::after{content:"";position:absolute;left:36px;bottom:-6px;width:14px;height:14px;background:var(--red);transform:rotate(45deg)}
.hint-pop .btn{background:#fff;color:var(--red-ink);border-color:transparent}

/* ---------- clear desk reward ---------- */
.zero{margin-top:28px;border-radius:var(--r-xl);background:var(--ink);color:var(--bg);padding:44px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center;overflow:hidden;position:relative}
.zero h2{font-size:clamp(36px,5vw,60px);line-height:1;font-weight:800;letter-spacing:-.04em;margin:0}
.zero p{font-size:17px;opacity:.72;margin:14px 0 0;max-width:420px;line-height:1.5}
.zero-art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;transform:rotate(-4deg)}
.zero-art > *{aspect-ratio:4/5;border-radius:14px;overflow:hidden;background:#2A2A2C;animation:float 6s var(--ease) infinite alternate}
.zero-art > *:nth-child(2){animation-delay:-2s;transform:translateY(18px)}
.zero-art > *:nth-child(3){animation-delay:-4s}
.zero-art img{width:100%;height:100%;object-fit:cover}
@keyframes float{from{translate:0 0}to{translate:0 -10px}}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;min-height:150px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sh-1)}
.day.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red),var(--sh-2)}
.day.past{opacity:.55}
.day-h{display:flex;align-items:baseline;justify-content:space-between}
.day-h span{font-size:12px;font-weight:750;color:var(--muted);letter-spacing:.06em}
.day-h b{font-size:22px;font-weight:800;letter-spacing:-.03em}
.day.today .day-h span,.day.today .day-h b{color:var(--red-ink)}
.evp{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,var(--k) 12%,transparent);border-left:3px solid var(--k);font-size:12px;line-height:1.3;transition:background .15s}
.evp b{display:block;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evp span{color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evp.mine{background:color-mix(in srgb,var(--k) 22%,transparent)}
button.evp:hover{background:color-mix(in srgb,var(--k) 26%,transparent)}
.dadd{margin-top:auto;min-height:30px;border-radius:9px;border:1px dashed var(--line-2);color:var(--muted);font-size:16px;font-weight:700;opacity:0;transition:opacity .15s}
.day:hover .dadd,.dadd:focus-visible{opacity:1}

/* ---------- studio wall ---------- */
.wall{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.wall figure{margin:0;scroll-snap-align:start}
.wall .wimg{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:var(--sunk);position:relative;box-shadow:var(--sh-1)}
.wall .wimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.wall figure:hover img{transform:scale(1.04)}
.wall figcaption{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.wall figcaption b{display:block;font-size:14px;font-weight:700}

/* ---------- PM queue ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.stat{padding:20px 22px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1)}
.stat b{display:block;font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.stat.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat.ink span{color:inherit;opacity:.65}
.queue{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.qcard{display:flex;flex-direction:column;text-align:left;border-radius:var(--r-l);overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-1);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
.qcard .qimg{aspect-ratio:16/10;background:var(--sunk);position:relative;overflow:hidden}
.qcard .qimg img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.qcard:hover .qimg img{transform:scale(1.04)}
.qcard .qimg .tag{position:absolute;left:12px;top:12px}
.qcard .qimg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.qcard .qb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px}
.qcard .qb b.t{font-size:17px;font-weight:750;letter-spacing:-.01em}
.qmeta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}

/* ---------- immersive review ---------- */
.viewer{position:fixed;inset:0;z-index:50;background:#0B0B0C;color:#F3F2EE;display:grid;grid-template-rows:auto 1fr;animation:fadein .25s var(--ease) both;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);--muted:#A3A09A;--surface:#17171A;--surface-2:#1D1D20;--ink:#F3F2EE;--ink-2:#D5D3CE;--sunk:#121214;--red-ink:#FF6B7C;--red-soft:rgba(232,39,61,.18);--ok:#4CC08C;--ok-soft:rgba(76,192,140,.15);--faint:#6C6A66}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.v-top{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
.v-top .t{min-width:0;flex:1}
.v-top .t b{display:block;font-size:16px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-top .t span{font-size:13px;color:var(--muted)}
.v-top .btn{background:transparent;border-color:var(--line-2);color:#F3F2EE}
.v-top .btn:hover{border-color:#fff}
.v-top .seg{background:#141416;box-shadow:none;border:1px solid var(--line)}
.v-top .seg button[aria-selected="true"],.v-top .seg button[aria-pressed="true"]{background:#2A2A2E;box-shadow:none;color:#fff}
.v-body{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.v-stage{padding:28px;overflow:auto;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:flex-start}
.v-side{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#111113}
.v-side-in{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.v-foot{padding:16px 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:#111113}
.v-foot .row{display:flex;gap:10px}
.v-foot .row > *{flex:1}
.stage{position:relative;max-width:100%;border-radius:12px;overflow:hidden;line-height:0;box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.stage img{max-width:100%;max-height:calc(100vh - 180px);width:auto;user-select:none}
.stage.can{cursor:crosshair}
.stage.frame{width:min(100%,1100px);aspect-ratio:16/10;line-height:normal;background:#000}
.stage.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stage .pinlayer{display:none}
.stage.marking .pinlayer{display:block;position:absolute;inset:0;cursor:crosshair;background:rgba(232,39,61,.07);outline:2px dashed #E8273D;outline-offset:-2px}
.stage-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.stage-a .btn{background:transparent;color:#F3F2EE;border-color:var(--line-2)}
.stage-a .btn.primary{background:#E8273D;border-color:#E8273D}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50% 50% 50% 4px;background:#E8273D;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 6px 16px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.9);animation:pinin .35s var(--spring) both;z-index:3}
.pin.new{background:#fff;color:#E8273D;box-shadow:0 0 0 3px #E8273D,0 6px 16px rgba(0,0,0,.45)}
.pin.fixed{background:#1D9E6B}
.pin.static{position:static;margin:0;animation:none;box-shadow:none;width:26px;height:26px;flex:none}
@keyframes pinin{from{transform:scale(0)}to{transform:none}}
.said{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:#1A1A1D}
.said p{margin:0;font-size:14px;line-height:1.5}
.notes{display:flex;flex-direction:column;gap:8px}
.nt{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:#17171A;border:1px solid var(--line);transition:background .2s}
.nt p{margin:0;font-size:14px;line-height:1.5;flex:1}
.nt.flash{background:rgba(232,39,61,.18)}
.nt.is-fixed p{color:var(--muted)}
.addnote{display:flex;flex-direction:column;gap:8px}
.addnote .input{background:#17171A;border-color:var(--line-2);color:#F3F2EE;min-height:84px}
.addnote-a{display:flex;justify-content:space-between;gap:8px;align-items:center}
.v-foot .btn{border-color:var(--line-2);background:#1A1A1D;color:#F3F2EE}
.v-foot .btn.primary{background:#E8273D;border-color:#E8273D}
.v-foot .hint{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.v-state{font-size:14px;font-weight:700;padding:14px;border-radius:14px;background:#17171A;text-align:center}
.v-state.ok{color:var(--ok)}
.linkcard{display:flex;align-items:center;gap:14px;padding:18px;border-radius:16px;background:#17171A;border:1px solid var(--line);width:min(100%,640px);text-decoration:none;color:#F3F2EE;line-height:1.4}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.cmp-h{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}
.cmp .stage img{max-height:calc(100vh - 260px)}

/* approval stamp */
.stamp-wrap{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at center,rgba(0,0,0,.35),transparent 70%);animation:fadein .2s both}
.stamp{border:7px solid #E8273D;color:#E8273D;border-radius:18px;padding:16px 34px;font-size:clamp(44px,8vw,96px);font-weight:900;letter-spacing:.04em;background:rgba(255,255,255,.92);animation:stamp .55s var(--spring) both;transform:rotate(-10deg)}
.stamp.back{border-color:#141414;color:#141414}
@keyframes stamp{0%{opacity:0;transform:rotate(-10deg) scale(2.2)}60%{opacity:1;transform:rotate(-10deg) scale(.94)}100%{opacity:1;transform:rotate(-10deg) scale(1)}}

/* ---------- picker ---------- */
.login{min-height:100vh;padding:64px 28px;display:flex;flex-direction:column;align-items:center;gap:40px}
.login-h{text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:760px}
.login-h .display{text-align:center}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;max-width:960px}
.person{position:relative;display:flex;align-items:center;gap:18px;padding:22px;border-radius:var(--r-xl);background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--sh-1);transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .2s}
.person:hover{transform:translateY(-4px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.person:active{transform:translateY(-1px) scale(.99)}
.person b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.person .muted{font-size:13px}
.person .load{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.person kbd{position:absolute;right:16px;top:16px}
.group-l{grid-column:1/-1;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:10px 0 -4px}
.login-f{display:flex;gap:10px;align-items:center}

/* ---------- planner (agency) ---------- */
.plan-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:52px 0 14px}
.plan-h h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.plan-h > .btn{margin-left:auto}
.plan-nav{display:flex;align-items:center;gap:6px;font-weight:700}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:650;margin-bottom:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.annform{display:flex;flex-direction:column;gap:10px;padding:18px}
.annform-a{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seen{display:flex;align-items:center;gap:8px;flex:none}
.seen .unseen{opacity:.3;filter:grayscale(1)}

/* ---------- project page header ---------- */
.ph-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{margin:-8px 0 18px -10px}
.addp{padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:10px}
.addp-r{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.addp-r .input{flex:1;min-width:180px}

/* ---------- modal (floats) ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(10,10,12,.42)}
@supports (backdrop-filter:blur(1px)){.overlay{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}}
.overlay.on{display:flex;animation:fadein .18s both}
.modal{width:min(620px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-pop);padding:28px;display:flex;flex-direction:column;gap:16px;animation:sheet .32s var(--spring) both}
@keyframes sheet{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
.field{display:flex;flex-direction:column;gap:8px}
.flabel,.field > label{font-size:13px;font-weight:700;color:var(--ink-2)}
.m-a{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:4px;flex-wrap:wrap}
.linkrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.linkrow .input{flex:1}
.fixlist{display:flex;flex-direction:column;gap:6px}
.fixrow{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;padding:12px 14px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer}
.fixrow input{width:18px;height:18px;accent-color:var(--red);margin-top:1px;flex:none}
.datepick{position:relative}
.datepick input{border:0;background:transparent;font:inherit;color:inherit;width:130px}

/* ---------- command palette ---------- */
.pal-ov{position:fixed;inset:0;z-index:80;background:rgba(10,10,12,.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 20px 20px;animation:fadein .15s both}
@supports (backdrop-filter:blur(1px)){.pal-ov{backdrop-filter:blur(4px)}}
.pal{width:min(640px,100%);border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);animation:sheet .25s var(--spring) both}
.pal-in{display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--line)}
.pal-in input{flex:1;min-height:60px;border:0;background:transparent;font:500 18px var(--font);color:var(--ink);outline:none}
.pal-list{max-height:min(420px,56vh);overflow:auto;padding:8px}
.pal-g{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--muted);padding:10px 12px 6px;text-transform:uppercase}
.pal-it{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border-radius:12px;text-align:left;font-size:14px}
.pal-it .sub{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.pal-it[aria-selected="true"]{background:var(--sunk)}
.pal-it[aria-selected="true"] .i{color:var(--red)}
.pal-empty{padding:28px;text-align:center;color:var(--muted)}
.pal-f{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pal-f span{display:flex;gap:6px;align-items:center}

/* shortcuts sheet */
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 24px}
.keys div{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}

/* ---------- toast (floats) ---------- */
.toast{position:fixed;left:50%;bottom:28px;z-index:95;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:16px;padding:12px 14px 12px 18px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:600;box-shadow:var(--sh-pop);transition:opacity .2s var(--ease),transform .35s var(--spring);max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast .lnk{color:var(--red);padding:0 4px;text-decoration:none;font-weight:800}
body.dark .toast .lnk{color:#FF6B7C}
.toast .tk{width:22px;height:22px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.toast .tk .i{width:13px;height:13px;stroke-width:3}

/* ---------- responsive ---------- */
.hide-s{}
@media (max-width:1000px){.search{min-width:0}.search span,.search kbd{display:none}.brand b{display:none}}
@media (max-width:860px){
  .focus,.zero{grid-template-columns:1fr}
  .focus-m{min-height:240px;order:-1}
  .week{grid-template-columns:1fr}
  .day{min-height:0}
  .v-body{grid-template-columns:1fr;overflow:auto}
  .v-side{border-left:0;border-top:1px solid var(--line)}
  .cmp{grid-template-columns:1fr}
  .people{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
}
@media (max-width:640px){
  .page{padding:28px 16px 100px}
  .bar-in{gap:8px;padding:8px 12px;flex-wrap:wrap}
  .tabs{order:3;width:100%;justify-content:space-between}
  .tabs button{flex:1;justify-content:center;padding:0 8px}
  .hide-s{display:none!important}
  .focus-b,.zero{padding:24px}
  .people{grid-template-columns:1fr}
  .rw-btn > .chip{width:auto}
  .stat b{font-size:32px}
  .keys{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
::view-transition-old(root){animation:vt-out .14s ease-out both}
::view-transition-new(root){animation:vt-in .2s ease-out both}
@keyframes vt-out{to{opacity:0}}
@keyframes vt-in{from{opacity:0}}
/* refinements */
.people{grid-template-columns:repeat(2,minmax(0,1fr));max-width:780px}
.focus-m img{object-fit:contain;padding:28px}
.qcard .qimg img{object-fit:contain;padding:14px}
.focus-a .btn.ghost{padding:0 10px;border-color:transparent}
.queue{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
@media (max-width:640px){.people{grid-template-columns:1fr}}
@media (max-width:640px){
  .ann{flex-wrap:wrap}.ann > div{flex:1 1 calc(100% - 60px)}.ann .btn{width:100%}
  .focus-m.noart{display:none}
  .day.none:not(.today){display:none}
  .sec{flex-wrap:wrap}
}

/* =========== v6: calmer layout, soft touch, Material 3 Expressive motion =========== */
:root{
  --spring-fast:cubic-bezier(.22,1,.36,1);
  --spring-slow:cubic-bezier(.16,1,.3,1);
  --soft-up:4px 4px 10px rgba(20,20,20,.09),-4px -4px 10px rgba(255,255,255,.95);
  --soft-up-lg:8px 8px 22px rgba(20,20,20,.09),-8px -8px 22px rgba(255,255,255,.95);
  --soft-in:inset 3px 3px 7px rgba(20,20,20,.1),inset -3px -3px 7px rgba(255,255,255,.9);
}
body.dark{
  --soft-up:4px 4px 10px rgba(0,0,0,.55),-3px -3px 9px rgba(255,255,255,.035);
  --soft-up-lg:8px 8px 22px rgba(0,0,0,.6),-6px -6px 18px rgba(255,255,255,.035);
  --soft-in:inset 3px 3px 7px rgba(0,0,0,.6),inset -3px -3px 7px rgba(255,255,255,.04);
}
/* more air */
.page{max-width:1040px;padding:56px 28px 160px}
.sec{margin:72px 0 16px}
.display{font-size:clamp(40px,5.4vw,68px)}
.lede{font-size:17px;margin-top:12px}
.focus,.zero,.anns,.stats{margin-top:36px}
.focus-b{padding:40px;gap:18px}

/* greyed-out sample artwork */
img.sample{filter:grayscale(1) contrast(.62) brightness(1.12);opacity:.78}
body.dark img.sample{filter:grayscale(1) contrast(.6) brightness(.8);opacity:.7}
.focus-m:has(img.sample),.qimg:has(img.sample),.wimg:has(img.sample),.zero-art > *:has(img.sample){background:var(--sunk)}

/* ---- buttons: pill at rest, morph to squircle when pressed (M3E shape morph) ---- */
.btn{border-radius:999px;transition:border-radius .35s var(--spring-fast),transform .35s var(--spring-fast),background .2s,border-color .2s,box-shadow .2s}
.btn:active{border-radius:12px;transform:scale(.96)}
.btn.xl{border-radius:999px}
.btn.xl:active{border-radius:16px}
.btn.sm:active{border-radius:9px}
/* ---- toggles: soft, round when off, squircle and sunken when on ---- */
.pick{border-radius:999px;background:var(--bg);border-color:transparent;box-shadow:var(--soft-up);transition:border-radius .4s var(--spring-fast),box-shadow .25s,background .2s,color .2s,transform .3s var(--spring-fast)}
.pick:hover{border-color:transparent}
.pick:active{transform:scale(.95)}
.pick[aria-pressed="true"],.pick.on{border-radius:12px;background:var(--bg);color:var(--red-ink);border-color:transparent;box-shadow:var(--soft-in)}
.modal .pick{background:var(--surface)}
.modal .pick[aria-pressed="true"]{background:var(--surface-2)}
/* connected button group (M3E): the selected one morphs */
.seg{gap:3px;background:var(--bg);box-shadow:var(--soft-in);border-radius:999px;padding:4px}
.seg button{border-radius:999px;transition:border-radius .4s var(--spring-fast),background .2s,box-shadow .2s,color .2s}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{border-radius:10px;background:var(--bg);box-shadow:var(--soft-up);color:var(--ink)}
.tabs{border-radius:999px;background:var(--bg);box-shadow:var(--soft-in)}
.tabs button{border-radius:999px;transition:border-radius .4s var(--spring-fast),background .2s,box-shadow .2s,color .2s}
.tabs button[aria-current]{border-radius:12px;background:var(--bg);box-shadow:var(--soft-up)}
/* soft icon buttons */
.icon-btn{background:var(--bg);box-shadow:var(--soft-up);border-radius:999px;transition:border-radius .35s var(--spring-fast),box-shadow .2s,transform .3s var(--spring-fast)}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.icon-btn:active{box-shadow:var(--soft-in);border-radius:12px;transform:scale(.94)}
.nt .icon-btn,.viewer .icon-btn{background:transparent;box-shadow:none}
/* soft overview stats */
.stat{background:var(--bg);border:0;box-shadow:var(--soft-up-lg);border-radius:var(--r-xl)}
.stat.ink{box-shadow:var(--sh-2)}
/* soft person tiles on the first page */
.person{background:var(--bg);border:0;box-shadow:var(--soft-up-lg);transition:transform .45s var(--spring-fast),box-shadow .3s}
.person:hover{transform:translateY(-4px);box-shadow:var(--soft-up-lg);border:0}
.person:active{transform:scale(.98);box-shadow:var(--soft-in)}
.mark{background:var(--bg);border:0;box-shadow:var(--soft-up)}

/* ---- neumorphic switch (theme) ---- */
.switch{margin-left:auto;width:46px;height:26px;border-radius:999px;background:var(--bg);box-shadow:var(--soft-in);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--bg);box-shadow:var(--soft-up);transition:transform .45s var(--spring-fast),width .3s var(--spring-fast),background .2s}
.switch.on::after{transform:translateX(20px);background:var(--red)}
.menu-item:active .switch::after{width:26px}

/* ---- FAB menu (M3E) ---- */
.fab-w{position:fixed;right:28px;bottom:28px;z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{width:64px;height:64px;border-radius:20px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px -8px var(--red-glow),0 2px 6px rgba(0,0,0,.12);transition:border-radius .45s var(--spring-fast),transform .45s var(--spring-fast),width .45s var(--spring-fast),height .45s var(--spring-fast)}
.fab .i{width:26px;height:26px;stroke-width:2.2;transition:transform .45s var(--spring-fast)}
.fab:hover{border-radius:24px}
.fab:active{transform:scale(.92);border-radius:32px}
.fab.open{width:56px;height:56px;border-radius:50%}
.fab.open .i{transform:rotate(135deg)}
.fab-menu{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab-item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 22px 0 18px;border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;box-shadow:var(--sh-pop);animation:fabin .5s var(--spring-fast) both;transition:border-radius .35s var(--spring-fast),transform .35s var(--spring-fast)}
.fab-item:hover{background:var(--surface-2)}
.fab-item:active{border-radius:16px;transform:scale(.96)}
.fab-item .i{color:var(--red)}
.fab-item:nth-last-child(2){animation-delay:.04s}.fab-item:nth-last-child(3){animation-delay:.08s}
@keyframes fabin{from{opacity:0;transform:translateY(16px) scale(.8)}to{opacity:1;transform:none}}
.fab-scrim{position:fixed;inset:0;z-index:44;background:rgba(10,10,12,.18);animation:fadein .2s both}
.fab-label{position:absolute;right:76px;bottom:20px;white-space:nowrap}

/* ---- loading indicator: morphing shape ---- */
.loader{width:56px;height:56px;background:var(--red);animation:morph 1.6s var(--spring-slow) infinite}
@keyframes morph{0%{border-radius:50%;transform:rotate(0) scale(1)}25%{border-radius:30% 70% 70% 30%/30% 30% 70% 70%;transform:rotate(90deg) scale(.86)}50%{border-radius:18%;transform:rotate(180deg) scale(1)}75%{border-radius:70% 30% 50% 50%/40% 60% 40% 60%;transform:rotate(270deg) scale(.9)}100%{border-radius:50%;transform:rotate(360deg) scale(1)}}

/* ---- wavy progress (M3E) ---- */
.wavy{display:flex;align-items:center;gap:12px;margin-top:16px;max-width:420px}
.wavy svg{flex:1;height:14px;overflow:visible}
.wavy .track{stroke:var(--line-2)}

.wavy b{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap}
@keyframes wave{to{stroke-dashoffset:-24}}

/* ---- spring motion everywhere it helps ---- */
.page.enter > *{animation:rise .7s var(--spring-slow) both}
.modal{animation:sheet .55s var(--spring-fast) both}
.menu{animation:pop .45s var(--spring-fast) both}
.toast{transition:opacity .2s var(--ease),transform .55s var(--spring-fast)}
.qcard,.wall figure{transition:transform .5s var(--spring-fast),box-shadow .3s}
.qcard:hover{transform:translateY(-4px)}
.qcard:active{transform:scale(.98)}
.pin{animation:pinin .55s var(--spring-fast) both}

/* ---------- smooth motion ---------- */
/* One entrance per page: a short fade and a small lift, no bounce. The view transition only crossfades. */
.page.enter > *{animation:rise .42s cubic-bezier(.22,1,.36,1) both}
.page.enter > *:nth-child(2){animation-delay:.03s}.page.enter > *:nth-child(3){animation-delay:.06s}.page.enter > *:nth-child(4){animation-delay:.09s}.page.enter > *:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Switching a finance tab fades the new content in */
.fin-pane{animation:pane .26s cubic-bezier(.22,1,.36,1) both}
@keyframes pane{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* Sheets and the search palette leave as gently as they arrive */
.modal{animation:sheet .32s cubic-bezier(.22,1,.36,1) both}
@keyframes sheet{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.overlay.closing{animation:fadeout .17s ease-in both}
.overlay.closing .modal{animation:sheetout .17s ease-in both}
#palette.closing .pal-ov{animation:fadeout .15s ease-in both}
@keyframes fadeout{to{opacity:0}}
@keyframes sheetout{to{opacity:0;transform:translateY(8px) scale(.985)}}
/* State changes animate instead of snapping */
.seg button,.pick,.chip,.tab,.tabs button,.icon-btn,.switch,.switch::after{transition:background-color .22s ease,color .22s ease,box-shadow .25s ease,border-radius .3s cubic-bezier(.22,1,.36,1),transform .25s cubic-bezier(.22,1,.36,1)}
.btn{transition:background-color .2s ease,border-color .2s ease,box-shadow .25s ease,border-radius .3s cubic-bezier(.22,1,.36,1),transform .2s cubic-bezier(.22,1,.36,1)}
.btn:active,.pick:active,.icon-btn:active{transform:scale(.97)}
.bar-t i{transition:width .6s cubic-bezier(.22,1,.36,1)}
.menu{animation:pop .24s cubic-bezier(.22,1,.36,1) both}
@media (prefers-reduced-motion:reduce){.fin-pane,.modal,.overlay.closing,.overlay.closing .modal,.page.enter > *{animation:none!important}}
/* Press feedback without a jumpy shape change on quick taps */
.btn:active{border-radius:20px;transform:scale(.97)}
.btn.xl:active{border-radius:22px}.btn.sm:active{border-radius:14px}
.icon-btn:active{border-radius:16px;transform:scale(.96)}
.fab-item:active{border-radius:22px;transform:scale(.98)}

/* ---------- colour meaning ----------
   green  = money in, done, paid, approved (gain, safety)
   amber  = waiting, owed, needs a look (caution, not danger)
   red    = overdue, lost, cancelled, and the one main action (urgency)
   blue   = in progress, meetings, information (calm, trust)
   ink    = ordinary facts and ordinary spending (spending is normal, not an alarm) */
.chip.info{background:var(--info-soft);color:var(--info)}
.owed{color:var(--warn)}
.fin-stats .stat.in b{color:var(--ok)}
.fin-stats .stat.pos b{color:var(--ok)}
.fin-stats .stat.neg b{color:var(--red-ink)}
.rep .owed span.muted{color:var(--muted)}

/* ---------- period bar (finance) ---------- */
.per-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px}
.per-bar .plan-nav b{min-width:150px;text-align:center}
.per-range{display:flex;align-items:center;gap:8px}
.per-range .input{width:170px}

/* ---------- month calendar ---------- */
.mon{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.mon-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.mon-h span{padding:10px 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mon-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mon-d{min-height:118px;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.mon-d:nth-child(7n){border-right:0}
.mon-d.out{background:var(--surface-2)}
.mon-d.out .mon-n,.mon-d.past .mon-e{opacity:.55}
.mon-n{display:flex}
.mon-n button,.mon-n span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:inherit;font-size:14px;font-weight:700;color:var(--ink);background:none;border:0;cursor:pointer;transition:background-color .2s ease}
.mon-n button:hover{background:var(--sunk)}
.mon-d.today .mon-n button,.mon-d.today .mon-n span{background:var(--ink);color:var(--bg)}
.mon-e{display:block;width:100%;text-align:left;font:inherit;font-size:12px;font-weight:600;line-height:1.3;padding:4px 6px 4px 8px;border:0;border-left:3px solid var(--k);border-radius:6px;background:color-mix(in srgb,var(--k) 10%,transparent);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;transition:background-color .2s ease}
.mon-e:hover{background:color-mix(in srgb,var(--k) 18%,transparent)}
.mon-more{align-self:flex-start;font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:none;border:0;padding:2px 4px;cursor:pointer}
.mon-more:hover{color:var(--ink)}
@media (max-width:760px){.mon-d{min-height:70px;padding:4px}.mon-e{font-size:0;height:6px;padding:0;border-left-width:0;background:var(--k)}.mon-h span{padding:8px 4px;text-align:center;font-size:10px}.mon-n button,.mon-n span{width:26px;height:26px;font-size:12px}}

/* =================== Application frame (Adobe-style workspaces) ===================
   Fixed frame: app bar, tools rail, status bar. Moving parts: the left panel and the inspector, which dock and collapse.
   Flat for reading (panels, lists), soft for touching (rail, switcher), glass for what floats (task bar, action bar, sheets). */
@media (min-width:900px){
  body.framed{overflow:hidden}
  body.framed #root{display:flex;flex-direction:column;height:100dvh}
  body.framed .topbar{position:relative;flex:none}
  body.framed .bar-in{max-width:none;padding:8px 16px;min-height:56px}
}
.frame{flex:1;min-height:0;display:flex;align-items:stretch;background:var(--bg)}
.canvas{flex:1;min-width:0;overflow:auto;position:relative;outline:none;scroll-behavior:smooth}
.canvas .page{padding-top:28px;padding-bottom:72px}
.canvas .fup-sum{top:8px}
.rail{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;border-right:1px solid var(--line);order:0}
.rail-sp{flex:1}
.rail-b{width:36px;height:36px;border-radius:11px;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:var(--soft-out,0 1px 2px rgba(0,0,0,.06));transition:box-shadow .2s ease,background-color .2s ease,transform .2s cubic-bezier(.22,1,.36,1)}
.rail-b .i{width:18px;height:18px}
.rail-b:hover{background:var(--surface-2)}
.rail-b.on{box-shadow:var(--soft-in,inset 0 1px 3px rgba(0,0,0,.12));background:var(--sunk)}
.rail-b:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.panel{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lp{width:264px;border-right:1px solid var(--line);order:1}
.insp{width:340px;border-left:1px solid var(--line);order:4}
.iw-narrow .insp{width:280px}.iw-wide .insp{width:420px}
.canvas{order:2}
.left-right .lp{order:3;border-right:0;border-left:1px solid var(--line)}
.left-right .strip-left{order:3}
.strip-insp{order:4}
.panel-h{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;height:42px;padding:0 8px 0 14px;border-bottom:1px solid var(--line)}
.panel-h b{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.panel-tools{display:flex;gap:4px}
.panel-tools .icon-btn{width:28px;height:28px}
.panel-tools .i{width:15px;height:15px}
.pw{display:block;width:14px;height:10px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.pw::after{content:"";position:absolute;top:1px;bottom:1px;right:1px;background:currentColor;border-radius:1px;width:3px}
.pw-regular::after{width:5px}.pw-wide::after{width:8px}
.panel-b{flex:1;min-height:0;overflow:auto;padding:12px}
.strip{flex:none;width:30px;border:0;border-right:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;transition:background-color .2s ease,color .2s ease}
.strip-insp{border-right:0;border-left:1px solid var(--line)}
.strip span{writing-mode:vertical-rl;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.strip:hover{background:var(--surface);color:var(--ink)}
.strip:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.bare .rail{border-right-color:transparent}
.statusbar{flex:none;display:flex;align-items:center;gap:18px;height:30px;padding:0 10px 0 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--bg)}
.sb-i{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sb-dot.off{background:var(--warn)}
.sb-sp{flex:1}
.sb-b{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:3px 8px;border-radius:6px;white-space:nowrap}
.sb-b:hover{background:var(--surface);color:var(--ink)}
.sb-b b{color:var(--ink)}
/* left panel lists */
.plist{display:flex;flex-direction:column;gap:2px}
.pl-r{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 8px;border:0;border-radius:10px;background:none;font:inherit;text-align:left;color:var(--ink);cursor:pointer;transition:background-color .18s ease}
.pl-r:hover{background:var(--surface)}
.pl-r.cur{background:var(--surface);box-shadow:inset 3px 0 0 var(--ink)}
.pl-r .i{width:16px;height:16px;flex:none}
.pl-m{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-m b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-m .muted{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-n{min-width:24px;height:22px;padding:0 6px;border-radius:7px;background:var(--surface);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pl-n.quiet{background:none;color:var(--muted);font-weight:600}
.pl-group{margin:14px 8px 4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pl-search{margin-bottom:8px}
.pl-r .chip{flex:none}
.pad{padding:8px}
/* selection: neutral ink ring, so it never reads as a status colour */
.is-sel{box-shadow:inset 0 0 0 2px var(--ink)!important}
.rw.is-sel{background:var(--surface)}
tr.is-sel td{background:var(--sunk)}
tr.is-sel{box-shadow:none!important}
tr.is-sel td:first-child{box-shadow:inset 3px 0 0 var(--ink)}
.txr.is-sel,.qcard.is-sel,.evp.is-sel,.mon-e.is-sel,.pl-r.is-sel{background:var(--surface)}
/* task bar (one selected) and action bar (several) */
.taskbar{position:fixed;z-index:25;display:flex;gap:4px;padding:5px;border-radius:14px;animation:pop .2s cubic-bezier(.22,1,.36,1) both}
.tb-b{height:32px;padding:0 12px;border-radius:10px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background-color .18s ease}
.tb-b:hover{background:var(--sunk)}
.tb-b.primary{background:var(--red);color:#fff}
.tb-b.primary:hover{filter:brightness(1.05)}
.tb-b kbd,.actionbar kbd{font:inherit;font-size:11px;opacity:.7;padding:1px 5px;border-radius:5px;border:1px solid currentColor}
.actionbar{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:26;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;border-radius:16px;max-width:calc(100vw - 32px);flex-wrap:wrap;animation:abin .24s cubic-bezier(.22,1,.36,1) both}
@keyframes abin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.ab-n{font-size:13px;white-space:nowrap}
.ab-f{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted)}
.ab-f .input{width:160px}
.btn.danger{color:var(--red-ink)}
/* inspector */
.ins-h{display:flex;flex-direction:column;gap:2px;margin:2px 2px 12px}
.ins-h .pdot{width:10px;height:10px;margin-bottom:6px}
.ins-h h3{font-size:18px;line-height:1.25;letter-spacing:-.01em;font-weight:750;word-break:break-word}
.ins-ph{flex-direction:row;align-items:center;gap:12px}
.ins-state{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:0 2px 12px}
.ins-prev{display:block;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface);padding:0;cursor:zoom-in;position:relative;margin-bottom:12px}
.ins-prev img,.ins-prev .ph{width:100%;height:100%;object-fit:cover}
.ins-prev .tag{position:absolute;left:8px;bottom:8px}
.ins-s{border-top:1px solid var(--line);padding:8px 2px}
.ins-s summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 0;border-radius:6px}
.ins-s summary::-webkit-details-marker{display:none}
.ins-s summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .2s ease;margin-right:4px}
.ins-s:not([open]) summary::after{transform:rotate(-45deg)}
.ins-s summary:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ins-sb{display:flex;flex-direction:column;gap:8px;padding:6px 0 4px}
.ins-r{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:10px}
.ins-l{font-size:12px;color:var(--muted)}
.ins-v{display:flex;align-items:center;gap:8px;min-width:0}
.ins-v .input{flex:1;min-width:0;width:100%}
.ins-v .chip{flex:none}
.ins-sb textarea.input{width:100%;resize:vertical}
.ins-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ins-link .i{width:14px;height:14px}
.ins-a{display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding:12px 2px 4px;margin-top:4px}
.ins-person{display:flex;align-items:center;gap:8px;font-size:13px}
.ins-person span:nth-child(2){flex:1}
.ins-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font:inherit;text-align:left;cursor:pointer}
.ins-item b{font-size:13px}.ins-item .muted{font-size:12px}
.ins-item:hover{border-color:var(--line-2)}
.ins-ev{font-size:13px;padding:6px 8px 6px 10px;border-left:3px solid var(--k);border-radius:6px;background:color-mix(in srgb,var(--k) 9%,transparent)}
.ins-empty{padding:6px 2px 12px}
.ins-empty b{font-size:16px}
.ins-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ins-stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.ins-stat b{font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ins-stat b.pos{color:var(--ok)}.ins-stat b.red{color:var(--red-ink)}.ins-stat b.warn-t{color:var(--warn)}
.ins-stat span{font-size:12px;color:var(--muted)}
/* history */
.hist{display:flex;flex-direction:column;max-height:56vh;overflow:auto;border:1px solid var(--line);border-radius:14px}
.hist-r{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 12px;border-bottom:1px solid var(--line)}
.hist-r:last-child{border-bottom:0}
.hist-r.done .hist-m{color:var(--muted);text-decoration:line-through}
.hist-t{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:40px}
.hist-m{flex:1;font-size:14px}
/* phones: one column, inspector as a bottom sheet, workspaces at the bottom */
.bnav,.lp-open{display:none}
@media (max-width:899px){
  .topbar .ws-switch{display:none}
  .frame{display:block}
  .canvas{overflow:visible}

  .fab-w{bottom:84px}

@keyframes sheetup{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}

@media (prefers-reduced-motion:reduce){.taskbar,.actionbar,.insp-sheet,.lp-drawer,.sheet-ov{animation:none!important}}

/* glass surfaces for what floats in the frame: solid first, frosted where the browser can */
.taskbar,.actionbar,.bnav,.insp-sheet,.lp-drawer{background:var(--surface);border:1px solid var(--line-2);box-shadow:var(--sh-pop,0 12px 32px rgba(0,0,0,.16))}
@supports (backdrop-filter:blur(1px)){.taskbar,.actionbar,.bnav,.insp-sheet,.lp-drawer{background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}}
.actionbar{flex-wrap:nowrap;left:var(--ab-x,50%)}
.ab-f .input{width:150px}
body:has(.actionbar) .toast{bottom:104px}
.insp .wavy{max-width:100%;margin:0 2px 12px}
.pl-st{display:inline-flex;align-items:center;gap:5px}
.pl-st .dot{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.pl-st.red .dot{background:var(--red)}.pl-st.warn .dot{background:var(--warn)}.pl-st.ok .dot{background:var(--ok)}
.insp .wavy svg{min-width:0;width:100%}
.ab-f span{white-space:nowrap}
.insp-sheet .wavy{max-width:100%;margin:0 0 12px}.insp-sheet .wavy svg{min-width:0;width:100%}
body:has(.insp-sheet) .fab-w,body:has(.lp-drawer) .fab-w{display:none}

/* =================== Spectrum 2 visual language ===================
   Values from Adobe Spectrum 2 tokens: gray scale, component heights (24/32/40/48),
   pill buttons, 8px fields, quiet action buttons, flat cards, solid popovers, blue focus.
   BrandOn keeps its red as the accent for the main call to action and urgency.
   Font: Source Sans 3, Adobe's open sibling of Adobe Clean, which covers Mongolian Өө Үү. */
:root{
  --s-gray-25:#FFFFFF; --s-gray-50:#F8F8F8; --s-gray-75:#F3F3F3; --s-gray-100:#E9E9E9; --s-gray-200:#E1E1E1; --s-gray-300:#DADADA;
  --s-gray-400:#C6C6C6; --s-gray-500:#8F8F8F; --s-gray-600:#717171; --s-gray-700:#505050; --s-gray-800:#292929; --s-gray-900:#131313;
  --s-blue:#3B63FB; --s-blue-soft:#EEF2FF; --s-focus:#4B75FF;
  --s-canvas:var(--s-gray-75); --s-chrome:var(--s-gray-50); --s-card:var(--s-gray-25); --s-card-2:var(--s-gray-50); --s-fill:var(--s-gray-100); --s-fill-hover:var(--s-gray-200); --s-fill-down:var(--s-gray-300);
  --red:#DA1F34; --red-ink:#C21A2D; --red-soft:#FFEBE9;
  --ok:#05834E; --ok-soft:#E2F5EA; --warn:#C24E00; --warn-soft:#FFEEDD;
  --sh-2:0 1px 4px rgba(0,0,0,.08);
  --sh-pop:0 2px 8px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.12);
  color-scheme:light;
}
body.dark{
  --s-gray-25:#111111; --s-gray-50:#1B1B1B; --s-gray-75:#222222; --s-gray-100:#2C2C2C; --s-gray-200:#323232; --s-gray-300:#393939;
  --s-gray-400:#444444; --s-gray-500:#6D6D6D; --s-gray-600:#8A8A8A; --s-gray-700:#AFAFAF; --s-gray-800:#DBDBDB; --s-gray-900:#F2F2F2;
  --s-blue:#5681FF; --s-blue-soft:rgba(86,129,255,.18); --s-focus:#6995FE;
  --s-canvas:var(--s-gray-25); --s-chrome:var(--s-gray-50); --s-card:var(--s-gray-75); --s-card-2:var(--s-gray-100); --s-fill:var(--s-gray-200); --s-fill-hover:var(--s-gray-300); --s-fill-down:var(--s-gray-400);
  --red:#E8273D; --red-ink:#FF6B5C; --red-soft:rgba(252,67,46,.16);
  --ok:#2DBA77; --ok-soft:rgba(9,157,89,.18); --warn:#F08A2E; --warn-soft:rgba(224,100,0,.18);
  --sh-2:0 1px 4px rgba(0,0,0,.4); --sh-pop:0 2px 8px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);
  color-scheme:dark;
}
/* aliases are declared on body so they resolve against the theme's own grays */
body,body.dark{
  --bg:var(--s-canvas); --chrome:var(--s-chrome); --surface:var(--s-card); --surface-2:var(--s-card-2); --sunk:var(--s-fill);
  --ink:var(--s-gray-900); --ink-2:var(--s-gray-800); --muted:var(--s-gray-700); --faint:var(--s-gray-600);
  --line:var(--s-gray-200); --line-2:var(--s-gray-300); --field:var(--s-gray-500);
  --info:var(--s-blue); --info-soft:var(--s-blue-soft); --sel:var(--s-blue); --sel-soft:var(--s-blue-soft);
  --red-glow:transparent;
  --r-s:8px; --r:10px; --r-l:12px; --r-xl:16px;
  --sh-1:none; --soft-up:none; --soft-in:none; --soft-up-lg:none; --glass:var(--s-chrome);
  --ease:cubic-bezier(.45,0,.4,1); --spring:var(--ease); --spring-fast:var(--ease); --spring-slow:var(--ease);
  --font:"Source Sans 3","Adobe Clean",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body{font:400 14px/1.5 var(--font);font-feature-settings:normal;letter-spacing:0}
::selection{background:var(--sel);color:#fff}
:focus-visible{outline:2px solid var(--s-focus);outline-offset:2px;border-radius:8px}
.i{stroke-width:1.75}

/* ---------- type: Spectrum heading, body and detail ---------- */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--muted)}
.display{font-size:clamp(26px,2.6vw,34px);line-height:1.2;font-weight:800;letter-spacing:-.005em;margin:4px 0 0}
.display .dot{color:var(--red)}
.h2{font-size:clamp(22px,2vw,27px);line-height:1.25;font-weight:800;letter-spacing:0}
.lede{font-size:16px;line-height:1.5;margin:6px 0 0}
.sec{margin:36px 0 10px}
.sec h3{font-size:16px;font-weight:700;letter-spacing:0;text-transform:none}
.page{padding:32px 32px 96px}
.canvas .page{padding-top:24px}
.page.enter > *{animation:rise .25s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
kbd{font:600 11px/1 var(--font);height:18px;min-width:18px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}

/* ---------- app frame: solid chrome, hairlines, 48px header ---------- */
.topbar,body.framed .topbar{background:var(--chrome);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line)}
.bar-in,body.framed .bar-in{min-height:48px;padding:6px 12px;gap:14px}
.brand{font-size:15px;font-weight:700;letter-spacing:0}
.mark{width:28px;height:28px;border-radius:8px;background:none;border:0;box-shadow:none}
.rail,.panel,.strip,.statusbar{background:var(--chrome)}
.rail{width:48px;padding:8px 0;gap:4px}
.rail-b{width:32px;height:32px;border-radius:8px;background:transparent;box-shadow:none;color:var(--ink-2)}
.rail-b:hover{background:var(--sunk)}
.rail-b.on{background:var(--s-gray-800);color:var(--s-gray-25);box-shadow:none}
.rail-b.on:hover{background:var(--s-gray-900)}
.panel-h{height:40px;padding:0 6px 0 14px}
.panel-h b{font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.panel-tools .icon-btn{width:28px;height:28px}
.strip span{font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.statusbar{height:28px;font-size:12px}
.sb-dot{background:var(--ok)}

/* workspace switcher: Spectrum tabs, 2px indicator under the current one */
.tabs,.tabs.ws-switch{background:none;box-shadow:none;padding:0;gap:0;border-radius:0;align-self:stretch}
.tabs button{min-height:0;height:100%;padding:0 12px;border-radius:0;font-size:14px;font-weight:600;color:var(--muted);box-shadow:none;position:relative;background:none}
.tabs button:hover{color:var(--ink);background:none}
.tabs button[aria-current]{color:var(--ink);font-weight:700;background:none;box-shadow:none;border-radius:0}
.tabs button[aria-current]::after{content:"";position:absolute;left:12px;right:12px;bottom:-7px;height:2px;border-radius:1px;background:var(--ink)}
.count{height:18px;min-width:18px;font-size:11px;font-weight:700;background:var(--red)}

/* ---------- controls ---------- */
/* buttons: pill, bold label, fill styles. Default is Spectrum "secondary fill" */
.btn,.btn:active,.btn.xl,.btn.xl:active,.btn.sm:active{border-radius:999px}
.btn{min-height:32px;padding:0 14px;font-size:14px;font-weight:700;border:0;background:var(--sunk);color:var(--ink-2);box-shadow:none;transition:background-color .13s var(--ease),color .13s var(--ease)}
.btn:hover{background:var(--s-fill-hover);border:0}
.btn:active{transform:none;background:var(--s-fill-down)}
.btn.primary{background:var(--red);color:#fff;box-shadow:none}
.btn.primary:hover,body.dark .btn.primary:hover{background:var(--red-ink);filter:none}
body.dark .btn.primary:hover{background:#FF3D53}
.btn.ink{background:var(--s-gray-800);color:var(--s-gray-25)}
.btn.ink:hover{background:var(--s-gray-900)}
.btn.ghost{background:transparent;border:0;border-radius:8px;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.xl{min-height:40px;padding:0 18px;font-size:16px}
.btn.sm{min-height:24px;height:28px;padding:0 12px;font-size:13px}
.btn.danger{color:var(--red-ink)}
.lnk{color:var(--s-blue);font-weight:600;text-decoration:underline}
/* action buttons: quiet, 8px corners */
.icon-btn,.icon-btn:hover,.icon-btn:active{background:transparent;box-shadow:none;border-radius:8px;transform:none}
.icon-btn{width:32px;height:32px;color:var(--ink-2)}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:active{background:var(--s-fill-hover)}
.icon-btn.sm{width:28px;height:28px;border-radius:8px}
/* segmented control */
.seg{background:var(--sunk);box-shadow:none;border-radius:8px;padding:2px;gap:2px}
.seg button,.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{border-radius:6px;min-height:28px;font-size:14px;font-weight:600}
.seg button{color:var(--muted);box-shadow:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line-2)}
/* toggle buttons and tags: selected is the neutral dark fill Spectrum uses */
.pick,.pick:hover,.pick:active,.pick[aria-pressed="true"],.pick.on,.modal .pick,.modal .pick[aria-pressed="true"]{border-radius:8px;box-shadow:none;transform:none}
.pick{min-height:32px;padding:0 12px;background:var(--sunk);border:0;color:var(--ink-2);font-weight:600}
.pick:hover{background:var(--s-fill-hover)}
.pick[aria-pressed="true"],.pick.on,.modal .pick[aria-pressed="true"]{background:var(--s-gray-800);color:var(--s-gray-25)}
.pick.sm{min-height:28px}
/* fields: 2px border, 8px corners, blue focus */
.input{min-height:40px;padding:8px 12px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);font-size:14px;transition:border-color .13s var(--ease)}
.input:hover{border-color:var(--field)}
.input:focus{border-color:var(--s-gray-800);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--s-focus)}
.input.sm{min-height:32px;padding:4px 10px;font-size:14px}
textarea.input{min-height:88px}
.input[disabled]{background:var(--s-gray-75);border-color:var(--s-gray-200);color:var(--muted)}
.search{min-height:32px;border-radius:999px;border:2px solid var(--line-2);background:var(--surface);box-shadow:none;font-size:14px;min-width:240px;padding:0 6px 0 12px}
.search:hover{border-color:var(--field)}
.userbtn{min-height:32px;border-radius:999px;font-weight:600}
.userbtn:hover{background:var(--sunk)}
/* switch */
.switch{width:28px;height:16px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--s-gray-600);border-radius:999px}
.switch::after{top:3px;left:3px;width:10px;height:10px;background:var(--s-gray-600);box-shadow:none;transition:transform .13s var(--ease)}
.switch.on{background:var(--red);box-shadow:none}
.switch.on::after{transform:translateX(12px);background:#fff}
.menu-item:active .switch::after{width:10px}

/* ---------- badges, avatars ---------- */
.chip{height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2)}
.chip .dot{width:6px;height:6px;opacity:1}
.chip.red{background:var(--red-soft);color:var(--red-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.av,.av-lg,.av-xl{font-weight:700;box-shadow:none}
.pdot{border-radius:3px}

/* ---------- cards, lists, tables: flat, 1px gray-200, 12px corners ---------- */
.card,.rows{border-radius:12px;border:1px solid var(--line);box-shadow:none;background:var(--surface)}
.rw{min-height:56px;padding:8px 16px;gap:12px}
.rw:hover{background:var(--surface-2)}
.rw-m b{font-size:14px;font-weight:700}
.rw-m .muted{font-size:13px}
.rw .dt span{font-size:18px;font-weight:700}
.empty{border-radius:12px;border:2px dashed var(--line-2)}
.stat,.stat.ink,.person,.person:hover,.person:active{border-radius:12px;box-shadow:none;transform:none}
.stat{background:var(--surface);border:1px solid var(--line)}
.stat.ink{background:var(--s-gray-800);color:var(--s-gray-25);border-color:transparent}
.person{background:var(--surface);border:1px solid var(--line)}
.person:hover{border-color:var(--field);box-shadow:var(--sh-2)}
.ins-stat,.ins-item{border-radius:10px}
.ins-h h3{font-size:18px;font-weight:800;letter-spacing:0}
.ins-s summary{font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.pl-group{font-size:12px;font-weight:700;letter-spacing:0;text-transform:none}
.pl-r{border-radius:8px;min-height:40px}
.pl-r.cur{background:var(--sel-soft);box-shadow:none}
.pl-r.cur b{color:var(--sel)}

/* selection: Spectrum blue, never confused with a status colour */
.is-sel{box-shadow:inset 0 0 0 2px var(--sel)!important}
.rw.is-sel,.txr.is-sel,.qcard.is-sel,.evp.is-sel,.mon-e.is-sel,.pl-r.is-sel{background:var(--sel-soft)}
tr.is-sel td{background:var(--sel-soft)}
tr.is-sel td:first-child{box-shadow:inset 3px 0 0 var(--sel)}
tr.is-sel{box-shadow:none!important}

/* ---------- floating things: solid popovers with Spectrum shadow ---------- */
.menu,.modal,.taskbar,.actionbar,.bnav,.insp-sheet,.lp-drawer,.pal{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none;border:1px solid var(--line);box-shadow:var(--sh-pop)}
.menu{border-radius:10px;padding:6px}
.menu-item{min-height:32px;border-radius:8px;padding:0 10px;font-weight:500}
.menu-item:hover{background:var(--sunk)}
.modal{border-radius:16px}
.taskbar{border-radius:12px;padding:4px}
.tb-b{height:28px;border-radius:999px;font-weight:700}
.tb-b:hover{background:var(--sunk)}
.tb-b.primary{background:var(--red)}
.actionbar{border-radius:12px}
.toast{border-radius:10px;background:var(--s-gray-800);color:var(--s-gray-25);font-weight:600;padding:10px 12px 10px 16px}
.overlay,.sheet-ov,.fab-scrim{background:rgba(0,0,0,.4)}
.fab{border-radius:999px;width:56px;height:56px;box-shadow:var(--sh-pop)}
.fab:hover,.fab:active{border-radius:999px;transform:none}
.fab-item{border-radius:999px;min-height:48px}

/* progress: Spectrum meter instead of the wave */
.wavy{gap:10px;margin-top:12px}
.meter-t{flex:1;height:4px;border-radius:2px;background:var(--s-gray-300);overflow:hidden;min-width:0}
.meter-t span{display:block;height:100%;border-radius:2px;background:var(--red);transition:width .3s var(--ease)}
.wavy b{font-size:13px;font-weight:600}
.loader{width:32px;height:32px;border-radius:50%;background:none;border:3px solid var(--s-gray-300);border-top-color:var(--red);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* calm motion: Spectrum uses short, plain transitions, not springs */
@media (prefers-reduced-motion:reduce){.page.enter > *,.loader{animation:none!important}}
select.input{padding-right:34px;background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%}
/* coach mark: Spectrum informative blue */
.hint-pop{background:var(--s-blue);border-radius:10px;font-weight:600}
.hint-pop::after{background:var(--s-blue);width:12px;height:12px;bottom:-5px}
.hint-pop .btn{background:#fff;color:var(--s-blue)}
.group-l{font-size:14px;font-weight:700;letter-spacing:0;color:var(--ink)}
/* headings that were tracked uppercase become Spectrum headings: sentence case, no tracking */
.cmp-h,.pal-g,.day-sep,.ag .dt b,.day-h span,.rw .dt b,.mon-h span{letter-spacing:0;text-transform:none;font-weight:600}
.plan-h h3,.fin-card-h h3,.report h3,.cost-box h3{font-size:16px;font-weight:700;letter-spacing:0;text-transform:none}
.rep .grp td{font-size:13px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink)}
.big-num,.stat b,.fin-stats b{letter-spacing:-.005em}
/* review viewer: Spectrum dark chrome */
.v-side,.v-foot{background:#1B1B1B}
.v-foot .row > *{min-width:0}
.v-foot .btn{background:#2C2C2C;color:#F2F2F2;overflow:hidden;text-overflow:ellipsis}
.v-foot .btn:hover{background:#393939}
.v-foot .btn.primary{background:#E8273D}
@media (max-width:899px){
  .bnav{border-radius:16px;padding:4px}
  .bnav button{border-radius:10px;font-size:11px;min-width:0}
  .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button[aria-current]{background:var(--s-gray-800);color:var(--s-gray-25)}
}

/* finance: one row. Spectrum tabs on the left, the period picker on the right */
.fin-top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:20px 0 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fin-tabs{display:flex;gap:4px;margin:0;flex-wrap:wrap;background:none;padding:0;box-shadow:none;border-radius:0}
.fin-tabs button{position:relative;height:40px;padding:0 10px;border-radius:0;background:none;box-shadow:none;font-size:14px;font-weight:600;color:var(--muted)}
.fin-tabs button:hover{color:var(--ink)}
.fin-tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;background:none;box-shadow:none}
.fin-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:1px;background:var(--ink)}
.fin-tabs button:focus-visible{outline-offset:-2px}
.per-pick{position:relative;display:flex;align-items:center;gap:2px;padding-bottom:4px}
.per-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 12px;border-radius:8px;border:2px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--ink);transition:border-color .13s var(--ease)}
.per-btn:hover{border-color:var(--field)}
.per-btn[aria-expanded="true"]{border-color:var(--s-gray-800)}
.per-btn .i{width:16px;height:16px;color:var(--muted)}
.per-btn b{font-weight:700;white-space:nowrap}
.per-pop{position:absolute;right:0;top:calc(100% + 6px);z-index:35;width:280px;padding:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-pop);animation:pop .13s var(--ease) both}
.per-g{padding:8px 10px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.per-it{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px 0 6px;border-radius:8px;font-size:14px;text-align:left;color:var(--ink)}
.per-it:hover,.per-it:focus-visible{background:var(--sunk);outline:none}
.per-it[aria-checked="true"]{font-weight:700}
.per-ck{width:18px;display:inline-flex;color:var(--s-blue)}
.per-ck .i{width:16px;height:16px;stroke-width:2.2}
.per-sep{height:1px;background:var(--line);margin:6px 4px}
.per-custom{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 6px 6px}
.per-custom label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.per-custom .input{width:100%;min-width:0;padding:4px 6px;font-size:13px}
.per-custom .btn{grid-column:1/-1;justify-self:end}
@media (max-width:899px){.fin-top{flex-direction:column;align-items:stretch}.fin-tabs{overflow-x:auto;flex-wrap:nowrap}.per-pick{align-self:flex-start}.per-pop{left:0;right:auto}}
.fin-head .ph-tools{display:flex;align-items:center;gap:12px}
.fin-head .per-pick{padding:0}
.fin-top{align-items:stretch}
/* avatars: plain Spectrum circles */
.av,.av-lg,.av-xl,.person .av-lg,.av:hover,.av-lg:hover,.av-xl:hover,.person:hover .av-lg{border-radius:50%!important;clip-path:none!important;box-shadow:none;transform:none;background-image:none}
.avs > *{clip-path:none!important;border-radius:50%!important;border:2px solid var(--surface);padding:0;background:none}

</style>
